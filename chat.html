<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>チャット | OTAKU LIVE</title>
  <style>
    :root{--card:#15151d;--text:#f7f7fb;--muted:#9da0ad;--accent:#8b5cf6;--accent2:#ec4899;--line:#2a2a36}
    *{box-sizing:border-box}body{margin:0;background:#0b0b10;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:720px;margin:0 auto;padding:0 0 92px}.head{position:sticky;top:0;z-index:5;background:rgba(11,11,16,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 16px}.headrow{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.back{color:#c8cad3;text-decoration:none;font-size:24px}.title{text-align:center;font-weight:800}.event{text-align:center;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.messages{padding:18px 14px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:80%;padding:11px 13px;border-radius:17px;line-height:1.5;font-size:15px;word-break:break-word}.mine{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border-bottom-right-radius:5px}.theirs{align-self:flex-start;background:#1c1c26;border:1px solid var(--line);border-bottom-left-radius:5px}.time{font-size:10px;opacity:.65;margin-top:5px}.empty{text-align:center;color:var(--muted);padding:40px 10px}.composer{position:fixed;bottom:0;left:0;right:0;background:rgba(11,11,16,.96);border-top:1px solid var(--line);backdrop-filter:blur(14px)}.composer .inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px}.composer textarea{resize:none;max-height:120px;min-height:46px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:#15151d;color:white;font-size:15px;outline:none}.send{border:0;border-radius:14px;padding:0 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800}.error{margin:20px;padding:16px;border-radius:14px;background:#2a1519;color:#ffc6cf;border:1px solid #5a2c33}
  </style>
</head>
<body>
<div class="wrap">
  <header class="head"><div class="headrow"><a class="back" href="dm.html">‹</a><div><div id="title" class="title">DM</div><div id="event" class="event"></div></div><span></span></div></header>
  <main id="messages" class="messages"><div class="empty">メッセージを読み込み中...</div></main>
</div>
<div class="composer"><div class="inner"><textarea id="input" maxlength="2000" placeholder="メッセージを入力"></textarea><button id="send" class="send">送信</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const id=new URLSearchParams(location.search).get('id'); let user=null,conversation=null,lastSignature='';
function fmtTime(iso){return new Date(iso).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}
async function init(){
  if(!id){location.href='dm.html';return}
  user=await otakuGetUser(); if(!user){location.href=otakuLoginUrl(location.href);return}
  const {data:c,error}=await otakuSupabase.from('otaku_conversations').select('id,event_id,owner_user_id,requester_user_id').eq('id',id).maybeSingle();
  if(error||!c){document.querySelector('.wrap').innerHTML='<div class="error">このDMを開けません。</div>';document.querySelector('.composer').style.display='none';return}
  conversation=c;
  const otherId=c.owner_user_id===user.id?c.requester_user_id:c.owner_user_id;
  const [{data:p},{data:e}]=await Promise.all([
    otakuSupabase.from('otaku_profiles').select('display_name,username').eq('id',otherId).maybeSingle(),
    otakuSupabase.from('otaku_events').select('title').eq('id',c.event_id).maybeSingle()
  ]);
  title.textContent=p?.display_name||p?.username||'ユーザー'; event.textContent=e?.title||''; document.title=(title.textContent||'DM')+' | OTAKU LIVE';
  await loadMessages(true); setInterval(()=>loadMessages(false),3000);
}
async function loadMessages(forceScroll){
  const {data,error}=await otakuSupabase.from('otaku_messages').select('id,sender_id,content,created_at').eq('conversation_id',id).order('created_at',{ascending:true});
  if(error)return;
  const rows=data||[]; const signature=rows.map(x=>x.id).join(','); if(signature===lastSignature)return; lastSignature=signature;
  messages.innerHTML=rows.length?rows.map(m=>`<div class="bubble ${m.sender_id===user.id?'mine':'theirs'}"><div>${esc(m.content).replace(/\n/g,'<br>')}</div><div class="time">${fmtTime(m.created_at)}</div></div>`).join(''):'<div class="empty">最初のメッセージを送ってみましょう。</div>';
  if(forceScroll||rows.length)window.scrollTo({top:document.body.scrollHeight,behavior:forceScroll?'auto':'smooth'});
}
async function sendMessage(){
  const content=input.value.trim(); if(!content||!conversation)return; send.disabled=true;
  const {error}=await otakuSupabase.from('otaku_messages').insert({conversation_id:id,sender_id:user.id,content});
  send.disabled=false; if(error){alert('送信できませんでした。');return} input.value=''; await loadMessages(true);
}
send.onclick=sendMessage;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
init();
</script>
</body>
</html>
