<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>公演詳細 | OTAKU LIVE</title>
  <style>
    :root{--bg:#0b0b10;--card:#15151d;--card2:#1c1c26;--text:#f7f7fb;--muted:#9da0ad;--accent:#8b5cf6;--accent2:#ec4899;--line:#2a2a36}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#0a0a0f,#11111a);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:760px;margin:0 auto;padding:18px 16px 96px}.back{display:inline-block;color:#c7c8d0;text-decoration:none;margin-bottom:16px}.hero{padding:22px;border-radius:24px;background:radial-gradient(circle at top right,rgba(139,92,246,.28),transparent 40%),linear-gradient(135deg,#1f1733,#171722);border:1px solid #343042}.hero h1{font-size:25px;line-height:1.3;margin:0 0 10px}.meta{color:#b9bbc7;line-height:1.8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 20px}.btn{border:none;border-radius:16px;padding:14px 12px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}.secondary{background:#242431;color:#eee;border:1px solid #343444}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.card h2{font-size:17px;margin:0 0 10px}.lock{color:var(--muted);font-size:14px;line-height:1.7}.stat{display:flex;gap:10px;flex-wrap:wrap}.chip{background:#20202a;border-radius:999px;padding:7px 10px;color:#d9dae2;font-size:13px}.notice{font-size:12px;color:#9294a1;margin-top:10px}.error{padding:20px;background:#2a1519;border:1px solid #5c2c34;border-radius:16px;color:#ffc7cf}
  </style>
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">← ホームへ戻る</a>
  <div id="root"><div class="card">公演情報を読み込み中...</div></div>
</main>
<script>
  const SUPABASE_URL='https://pfyvsweuvdnpmvabfflh.supabase.co';
  const KEY='sb_publishable_FJ9hNx9T4-sNV6Ypv94vJA_cCq5TxUp';
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function fmt(iso){const d=new Date(iso);return d.toLocaleString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'})}
  async function load(){
    const id=new URLSearchParams(location.search).get('id');
    if(!id){document.getElementById('root').innerHTML='<div class="error">公演IDがありません。</div>';return}
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/otaku_events?id=eq.${encodeURIComponent(id)}&select=id,title,venue,prefecture,city,starts_at,ends_at`,{headers:{apikey:KEY}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const rows=await r.json(); const e=rows[0]; if(!e) throw new Error('not found');
      document.title=e.title+' | OTAKU LIVE';
      document.getElementById('root').innerHTML=`
        <section class="hero"><div class="notice">DEMO公演</div><h1>${esc(e.title)}</h1><div class="meta">${fmt(e.starts_at)}<br>${esc(e.venue)}<br>${esc(e.prefecture||'')} ${esc(e.city||'')}</div></section>
        <div class="actions"><button class="btn primary" onclick="needLogin()">参戦する</button><button class="btn secondary" onclick="needLogin()">同行者を募集</button></div>
        <section class="card"><h2>この公演</h2><div class="stat"><span class="chip">👥 参戦予定 0人</span><span class="chip">🤝 同行募集 0件</span></div></section>
        <section class="card"><h2>同行者募集</h2><div class="lock">現在はログイン機能実装前です。次のステップで、プロフィール作成・参戦登録・同行募集・DMを接続します。</div></section>`;
    }catch(err){document.getElementById('root').innerHTML='<div class="error">公演情報の取得に失敗しました。</div>'}
  }
  function needLogin(){alert('次の実装でログイン・プロフィール作成・参戦登録を有効にします。')}
  load();
</script>
</body>
</html>
