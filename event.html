<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>公演詳細 | OTAKU LIVE</title>
  <style>
    :root{--bg:#0b0b10;--card:#15151d;--text:#f7f7fb;--muted:#9da0ad;--accent:#8b5cf6;--accent2:#ec4899;--line:#2a2a36;--ok:#34d399}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#0a0a0f,#11111a);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:760px;margin:0 auto;padding:18px 16px 96px}.back{display:inline-block;color:#c7c8d0;text-decoration:none;margin-bottom:16px}.hero{padding:22px;border-radius:24px;background:radial-gradient(circle at top right,rgba(139,92,246,.28),transparent 40%),linear-gradient(135deg,#1f1733,#171722);border:1px solid #343042}.hero h1{font-size:25px;line-height:1.3;margin:0 0 10px}.meta{color:#b9bbc7;line-height:1.8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 20px}.btn{border:none;border-radius:16px;padding:14px 12px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}.primary.on{background:var(--ok);color:#08130f}.secondary{background:#242431;color:#eee;border:1px solid #343444}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.card h2{font-size:17px;margin:0 0 10px}.muted{color:var(--muted);font-size:14px;line-height:1.7}.stat{display:flex;gap:10px;flex-wrap:wrap}.chip{background:#20202a;border-radius:999px;padding:7px 10px;color:#d9dae2;font-size:13px}.notice{font-size:12px;color:#9294a1;margin-top:10px}.error{padding:20px;background:#2a1519;border:1px solid #5c2c34;border-radius:16px;color:#ffc7cf}.post{padding:13px;border-radius:14px;background:#1e1e28;border:1px solid var(--line);margin-top:10px}.post .who{font-weight:800;margin-bottom:5px}.postbody{margin-top:9px;line-height:1.6}.postactions{margin-top:10px}.msgbtn{width:100%;border:1px solid #4b4167;background:#282238;color:#fff;padding:10px 12px;border-radius:12px;font-weight:700;cursor:pointer}.msgbtn:disabled{opacity:.55;cursor:default}.postmeta{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.smallchip{display:inline-flex;align-items:center;gap:3px;padding:5px 8px;border-radius:999px;background:#292934;color:#dedee8;font-size:12px}.smallchip.oshi{background:#3a1830;color:#ffb4da}.smallchip.same-ok{background:#173a2d;color:#a7f3d0}.smallchip.same-ng{background:#391d22;color:#ffbdc8}.smallchip.same-depends{background:#292934;color:#d9dae2}
  </style>
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">← ホームへ戻る</a>
  <div id="root"><div class="card">公演情報を読み込み中...</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="catalog.js"></script><script src="safety.js"></script>
<script src="event-status.js"></script>
<script src="favorites.js"></script>
<script>
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const id=new URLSearchParams(location.search).get('id'); let eventData=null,user=null,profile=null,isAttending=false,favoriteMap={};
  function fmt(iso){const d=new Date(iso);return d.toLocaleString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'})}
  function sameOshiMeta(policy){
    if(policy==='ok') return {label:'同担 ◎',cls:'same-ok'};
    if(policy==='ng') return {label:'同担 NG',cls:'same-ng'};
    return {label:'同担 どちらでも',cls:'same-depends'};
  }
  async function load(){
    if(!id){root.innerHTML='<div class="error">公演IDがありません。</div>';return}
    user=await otakuGetUser(); if(user) profile=await otakuGetProfile(user.id);
    const [eventRes,countRes,postRes] = await Promise.all([
      otakuSupabase.from('otaku_events').select('id,title,venue,prefecture,city,starts_at,ends_at,is_demo,source_url,source_checked_at').eq('publication_status','published').eq('id',id).maybeSingle(),
      otakuSupabase.from('otaku_event_attendees').select('*',{count:'exact',head:true}).eq('event_id',id),
      otakuSupabase.from('otaku_companion_posts').select('id,user_id,type,body,status,created_at,otaku_profiles(display_name,username,same_oshi_policy)').eq('event_id',id).eq('status','open').order('created_at',{ascending:false}).limit(20)
    ]);
    const e=eventRes.data,posts=postRes.data||[];
    if(eventRes.error||!e){root.innerHTML='<div class="error">公演情報の取得に失敗しました。</div>';return}
    eventData=e; document.title=e.title+' | OTAKU LIVE';

    favoriteMap={};
    const ids=[...new Set(posts.map(p=>p.user_id).filter(Boolean))];
    if(ids.length){
      const {data:favs}=await otakuSupabase.from('otaku_user_favorites').select('user_id,is_primary,created_at,otaku_idols(name,otaku_idol_groups(name))').in('user_id',ids).order('is_primary',{ascending:false}).order('created_at',{ascending:true});
      (favs||[]).forEach(f=>{if(!favoriteMap[f.user_id]) favoriteMap[f.user_id]=f});
    }

    if(user){const {data:a}=await otakuSupabase.from('otaku_event_attendees').select('event_id').eq('event_id',id).eq('user_id',user.id).maybeSingle();isAttending=!!a}
    render(countRes.count||0,posts);
  }
  function sourceHtml(e){
    try {const url=OtakuCatalog.sourceUrl(e.source_url);if(!url)return '';return '<section class="card"><a style="color:#dcc5ff" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">出典・最新の公演情報を確認 ↗</a><p class="notice">確認日: '+(e.source_checked_at?esc(fmt(e.source_checked_at)):'未確認')+' · 開催変更は出典をご確認ください。</p></section>'}catch{return ''}
  }
  function render(attendeeCount,posts){
    root.innerHTML=`
      <section class="hero"><div class="notice">${eventData.is_demo?"DEMO公演（動作確認用）":"実在公演 · 日本時間"}</div><h1>${esc(eventData.title)}</h1><div class="meta">${fmt(eventData.starts_at)}<br>${esc(eventData.venue)}<br>${esc(eventData.prefecture||'')} ${esc(eventData.city||'')}</div></section>
      ${sourceHtml(eventData)}<section class="card"><h2>公演掲示板</h2><p class="muted">この公演について情報交換できます。</p><a class="btn secondary" href="board.html?event=${encodeURIComponent(eventData.id)}">掲示板を見る・書き込む</a></section><div class="actions"><button id="attendBtn" class="btn primary ${isAttending?'on':''}">${isAttending?'参戦予定 ✓':'参戦する'}</button><button id="companionBtn" class="btn secondary">同行者を募集</button></div>
      <section class="card"><h2>この公演</h2><div class="stat"><span class="chip">👥 参戦予定 ${attendeeCount}人</span><span class="chip">🤝 同行募集 ${posts.length}件</span></div></section>
      <section class="card"><h2>同行者募集</h2>${posts.length?posts.map(p=>{
        const own=user&&p.user_id===user.id;
        const fav=favoriteMap[p.user_id];
        const idol=fav?.otaku_idols;
        const same=sameOshiMeta(p.otaku_profiles?.same_oshi_policy);
        const oshiHtml=idol?`<span class="smallchip oshi">♥ ${esc(idol.otaku_idol_groups?.name||'')} / ${esc(idol.name||'')}</span>`:'';
        return `<div class="post"><div class="who">${esc(p.otaku_profiles?.display_name||p.otaku_profiles?.username||'ユーザー')}</div><div class="postmeta">${oshiHtml}<span class="smallchip ${same.cls}">${same.label}</span><span class="smallchip">${p.type==='have_companion_ticket'?'同行枠あり':'一緒に行く人を探す'}</span></div><div class="postbody">${esc(p.body)}</div><div class="postactions"><button class="msgbtn" data-post="${p.id}" data-owner="${p.user_id}" ${own?'disabled':''}>${own?'自分の募集':'メッセージを送る'}</button><div class="safety-links">${own?`<button class="safety-btn" data-close="${p.id}">募集を終了</button>`:`<button class="safety-btn" data-report="${p.user_id}" data-context="${p.id}">通報</button><button class="safety-btn" data-block="${p.user_id}">ブロック</button>`}</div></div></div>`
      }).join(''):'<div class="muted">まだ募集はありません。</div>'}</section>`;
    attendBtn.onclick=toggleAttendance;
    companionBtn.onclick=()=>{if(!user){location.href=otakuLoginUrl(location.href);return}if(!profile){location.href=otakuProfileUrl(location.href);return}location.href=`companion.html?event=${encodeURIComponent(id)}`};
    document.querySelectorAll('.msgbtn:not(:disabled)').forEach(btn=>btn.addEventListener('click',()=>openConversation(btn.dataset.post,btn.dataset.owner,btn)));
    document.querySelectorAll('[data-close]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;try{await OtakuSafety.closePost(btn.dataset.close,user.id,load)}finally{btn.disabled=false}});
    document.querySelectorAll('[data-report]').forEach(btn=>btn.onclick=()=>OtakuSafety.report(btn.dataset.report,{postId:btn.dataset.context}));
    document.querySelectorAll('[data-block]').forEach(btn=>btn.onclick=()=>OtakuSafety.block(btn.dataset.block,load));
  }
  async function toggleAttendance(){
    if(!user){location.href=otakuLoginUrl(location.href);return} if(!profile){location.href=otakuProfileUrl(location.href);return} attendBtn.disabled=true;
    if(isAttending){await otakuSupabase.from('otaku_event_attendees').delete().eq('event_id',id).eq('user_id',user.id)}else{const {error}=await otakuSupabase.from('otaku_event_attendees').insert({event_id:id,user_id:user.id});if(error){alert('参戦登録に失敗しました。');attendBtn.disabled=false;return}}
    isAttending=!isAttending; load();
  }
  async function openConversation(postId,ownerId,button){
    if(!user){location.href=otakuLoginUrl(location.href);return} if(!profile){location.href=otakuProfileUrl(location.href);return} if(user.id===ownerId)return;
    button.disabled=true; button.textContent='開いています...';
    const {data:existing}=await otakuSupabase.from('otaku_conversations').select('id').eq('companion_post_id',postId).eq('requester_user_id',user.id).maybeSingle();
    if(existing?.id){location.href=`chat.html?id=${encodeURIComponent(existing.id)}`;return}
    const {data:newConv,error}=await otakuSupabase.from('otaku_conversations').insert({event_id:id,companion_post_id:postId,owner_user_id:ownerId,requester_user_id:user.id}).select('id').single();
    if(error||!newConv){
      const {data:retry}=await otakuSupabase.from('otaku_conversations').select('id').eq('companion_post_id',postId).eq('requester_user_id',user.id).maybeSingle();
      if(retry?.id){location.href=`chat.html?id=${encodeURIComponent(retry.id)}`;return}
      alert('DMを開始できませんでした。'); button.disabled=false; button.textContent='メッセージを送る'; return;
    }
    location.href=`chat.html?id=${encodeURIComponent(newConv.id)}`;
  }
  load();
</script>
</body>
</html>
