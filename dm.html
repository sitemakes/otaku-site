<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DM | OTAKU LIVE</title>
  <style>
    :root{--card:#15151d;--text:#f7f7fb;--muted:#9da0ad;--accent:#8b5cf6;--line:#2a2a36}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0a0a0f,#11111a);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:720px;margin:0 auto;padding:20px 16px 96px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{color:#bfc1cc;text-decoration:none}.card{display:block;color:inherit;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.card:hover{border-color:#4e4273}.name{font-weight:800;margin-bottom:4px}.event{font-size:13px;color:#c5c5d0;margin-bottom:6px}.preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:28px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:18px}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(11,11,16,.93);border-top:1px solid var(--line);backdrop-filter:blur(14px)}.bottom .inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:10px}.nav{text-align:center;color:#8e90a0;font-size:12px;text-decoration:none}.nav b{display:block;color:white;font-size:18px;margin-bottom:2px}.active{color:#fff}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top"><a class="back" href="index.html">← ホーム</a><h1 style="font-size:21px;margin:0">DM</h1><span></span></div>
  <div id="list"><div class="empty">DMを読み込み中...</div></div>
</main>
<nav class="bottom"><div class="inner"><a class="nav" href="index.html"><b>⌂</b>ホーム</a><a class="nav" href="index.html"><b>⌕</b>探す</a><a class="nav active" href="dm.html"><b>💬</b>DM</a><a class="nav" href="profile.html"><b>👤</b>マイページ</a></div></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let user=null;
async function init(){
  user=await otakuGetUser();
  if(!user){location.href=otakuLoginUrl(location.href);return}
  const {data:convs,error}=await otakuSupabase.from('otaku_conversations').select('id,event_id,owner_user_id,requester_user_id,created_at').order('created_at',{ascending:false});
  if(error){list.innerHTML='<div class="empty">DMを取得できませんでした。</div>';return}
  if(!convs?.length){list.innerHTML='<div class="empty">まだDMはありません。<br>同行募集からメッセージを送ると、ここに表示されます。</div>';return}
  const otherIds=[...new Set(convs.map(c=>c.owner_user_id===user.id?c.requester_user_id:c.owner_user_id))];
  const eventIds=[...new Set(convs.map(c=>c.event_id))];
  const convIds=convs.map(c=>c.id);
  const [{data:profiles},{data:events},{data:messages}]=await Promise.all([
    otakuSupabase.from('otaku_profiles').select('id,display_name,username').in('id',otherIds),
    otakuSupabase.from('otaku_events').select('id,title').in('id',eventIds),
    otakuSupabase.from('otaku_messages').select('conversation_id,content,created_at').in('conversation_id',convIds).order('created_at',{ascending:false})
  ]);
  const pMap=Object.fromEntries((profiles||[]).map(p=>[p.id,p]));
  const eMap=Object.fromEntries((events||[]).map(e=>[e.id,e]));
  const latest={}; for(const m of messages||[]){if(!latest[m.conversation_id])latest[m.conversation_id]=m}
  list.innerHTML=convs.map(c=>{const other=c.owner_user_id===user.id?c.requester_user_id:c.owner_user_id;const p=pMap[other]||{};const e=eMap[c.event_id]||{};const m=latest[c.id];return `<a class="card" href="chat.html?id=${encodeURIComponent(c.id)}"><div class="name">${esc(p.display_name||p.username||'ユーザー')}</div><div class="event">${esc(e.title||'公演')}</div><div class="preview">${m?esc(m.content):'まだメッセージはありません'}</div></a>`}).join('');
}
init();
</script>
</body>
</html>
