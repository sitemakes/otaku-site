<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ログイン | OTAKU LIVE</title>
  <style>
    :root{--bg:#0b0b10;--card:#15151d;--text:#f7f7fb;--muted:#9da0ad;--accent:#8b5cf6;--accent2:#ec4899;--line:#2a2a36}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#0a0a0f,#11111a);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:520px;margin:0 auto;padding:32px 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px}.brand{font-weight:900;letter-spacing:.06em;margin-bottom:20px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.tab{padding:11px;border-radius:12px;border:1px solid var(--line);background:#20202a;color:#ddd;font-weight:700;cursor:pointer}.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}.field{margin:12px 0}.field label{display:block;font-size:13px;color:#bbb;margin-bottom:6px}.field input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#0f0f15;color:white;font-size:16px}.btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}.sub{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.6}.msg{margin-top:14px;padding:12px;border-radius:12px;background:#211d2f;color:#d8d2ee;font-size:14px;display:none}.back{display:inline-block;margin-top:16px;color:#aaa;text-decoration:none}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">OTAKU LIVE</div>
    <section class="card">
      <div class="tabs"><button id="loginTab" class="tab active">ログイン</button><button id="signupTab" class="tab">新規登録</button></div>
      <div class="field"><label>メールアドレス</label><input id="email" type="email" autocomplete="email" /></div>
      <div class="field"><label>パスワード</label><input id="password" type="password" autocomplete="current-password" /></div>
      <button id="submit" class="btn">ログイン</button>
      <button id="forgot" type="button" style="display:block;width:100%;margin-top:14px;border:0;background:transparent;color:#cfc0ef;cursor:pointer">パスワードを忘れた場合</button>
      <div id="msg" class="msg"></div>
      <div class="sub">新規登録では確認メールが届く場合があります。確認後、このページからログインしてください。</div>
    </section>
    <a class="back" href="index.html">← ホームへ戻る</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    let mode='login';
    const loginTab=document.getElementById('loginTab');
    const signupTab=document.getElementById('signupTab');
    const submit=document.getElementById('submit');
    const msg=document.getElementById('msg');
    function setMode(next){mode=next;loginTab.classList.toggle('active',mode==='login');signupTab.classList.toggle('active',mode==='signup');submit.textContent=mode==='login'?'ログイン':'新規登録';}
    loginTab.onclick=()=>setMode('login'); signupTab.onclick=()=>setMode('signup');
    forgot.onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){show('先にメールアドレスを入力してください。');return}forgot.disabled=true;const {error}=await otakuSupabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});show(error?'再設定メールを送信できませんでした。メールアドレスを確認してください。':'再設定メールを送信しました。メール内のリンクを開いて新しいパスワードを設定してください。');forgot.disabled=false};
    function show(text){msg.style.display='block';msg.textContent=text}
    submit.onclick=async()=>{
      const email=document.getElementById('email').value.trim();
      const password=document.getElementById('password').value;
      if(!email||password.length<6){show('メールアドレスと6文字以上のパスワードを入力してください。');return}
      submit.disabled=true;
      if(mode==='login'){
        const {error}=await otakuSupabase.auth.signInWithPassword({email,password});
        if(error){show('ログインできませんでした。メールアドレス・パスワードを確認してください。');submit.disabled=false;return}
        await redirectAfterLogin();
      }else{
        const {data,error}=await otakuSupabase.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/login.html'}});
        if(error){show('登録できませんでした。別のメールアドレスかパスワードを試してください。');submit.disabled=false;return}
        if(data.session){await redirectAfterLogin();return}
        show('確認メールを送信しました。メール内のリンクを開いた後、ログインしてください。');submit.disabled=false;
      }
    };
    async function redirectAfterLogin(){const next=otakuNextUrl('index.html'),u=await otakuGetUser();if(!u)return;const profile=await otakuGetProfile(u.id);location.href=profile?next:`onboarding.html?next=${encodeURIComponent(next)}`}
    (async()=>{const u=await otakuGetUser();if(u) await redirectAfterLogin()})();
  </script>
</body>
</html>
