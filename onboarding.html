<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>はじめに | OTAKU LIVE</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #0b0b10; color: #f7f7fb; }
    .wrap { max-width: 560px; margin: auto; padding: 28px 16px 60px; }
    .card { background: #15151d; border: 1px solid #343042; border-radius: 22px; padding: 20px; }
    h1 { font-size: 23px; }
    p, .note { color: #b5b6c2; line-height: 1.7; font-size: 14px; }
    .field { margin: 14px 0; }
    .field label { display: block; font-size: 13px; color: #bbb; margin-bottom: 6px; }
    .field input { width: 100%; box-sizing: border-box; padding: 13px; border-radius: 12px; border: 1px solid #45404f; background: #101018; color: #fff; font: inherit; }
    .checks { display: grid; gap: 9px; margin: 16px 0; }
    .checks label { font-size: 14px; color: #ddd; }
    .checks input { margin-right: 8px; }
    .btn { width: 100%; padding: 14px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #8b5cf6, #ec4899); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; }
    .msg { min-height: 1.5em; color: #f0d3ef; margin-top: 12px; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>OTAKU LIVEをはじめよう</h1>
      <p>プロフィールを作ると、推しに合う公演や同行募集を見つけやすくなります。あとからマイページで変更できます。</p>
      <div class="field">
        <label for="username">ユーザーID</label>
        <input id="username" maxlength="30" placeholder="好きな英数字のID">
      </div>
      <div class="field">
        <label for="displayName">表示名</label>
        <input id="displayName" maxlength="60" placeholder="サイトで表示する名前">
      </div>
      <div class="field">
        <label for="prefecture">都道府県（任意）</label>
        <input id="prefecture" maxlength="100" placeholder="公開したい場合のみ入力">
      </div>
      <h2>通知設定</h2>
      <p class="note">最初はOFFです。必要なものだけ選んでください。</p>
      <div class="checks">
        <label><input id="inApp" type="checkbox">サイト内通知</label>
        <label><input id="dm" type="checkbox">DM通知</label>
        <label><input id="board" type="checkbox">掲示板通知</label>
        <label><input id="event" type="checkbox">参戦予定の公演リマインダー</label>
      </div>
      <button id="save" class="btn">プロフィールを作成する</button>
      <div id="msg" class="msg" role="status"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    'use strict';

    const next = otakuNextUrl('index.html');
    const msg = document.getElementById('msg');
    let user;

    async function init() {
      user = await otakuGetUser();
      if (!user) {
        location.href = otakuLoginUrl(location.href);
        return;
      }

      const existing = await otakuGetProfile(user.id);
      if (existing) {
        location.href = next;
        return;
      }

      document.getElementById('save').onclick = async () => {
        const username = document.getElementById('username').value.trim();
        const displayName = document.getElementById('displayName').value.trim();
        if (!username || !displayName) {
          msg.textContent = 'ユーザーIDと表示名を入力してください。';
          return;
        }

        const button = document.getElementById('save');
        button.disabled = true;
        const profile = {
          id: user.id,
          username,
          display_name: displayName,
          prefecture: document.getElementById('prefecture').value.trim() || null
        };
        const result = await otakuSupabase.from('otaku_profiles').insert(profile);
        if (result.error) {
          msg.textContent = result.error.code === '23505'
            ? 'そのユーザーIDは既に使われています。'
            : 'プロフィールを保存できませんでした。';
          button.disabled = false;
          return;
        }

        const notify = {
          user_id: user.id,
          in_app_enabled: document.getElementById('inApp').checked,
          dm_enabled: document.getElementById('dm').checked,
          board_enabled: document.getElementById('board').checked,
          event_reminder_enabled: document.getElementById('event').checked
        };
        const notifyResult = await otakuSupabase
          .from('otaku_notification_preferences')
          .upsert(notify, { onConflict: 'user_id' });
        if (notifyResult.error) {
          msg.textContent = 'プロフィールは作成しましたが通知設定を保存できませんでした。';
          button.disabled = false;
          return;
        }

        location.href = next;
      };
    }

    init();
  </script>
</body>
</html>
