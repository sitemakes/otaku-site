<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>会場ガイド管理 | OTAKU LIVE</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b0b10;color:#f7f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:24px 16px 60px}a{color:#d8c6ff}.card{background:#15151d;border:1px solid #343042;border-radius:20px;padding:20px;margin:18px 0}.note{color:#b9bbc7;font-size:14px;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;margin:12px 0 5px}input,textarea,select,button{width:100%;box-sizing:border-box;font:inherit;padding:12px;border:1px solid #45404f;border-radius:10px;background:#101018;color:inherit}textarea{min-height:88px;resize:vertical}button{cursor:pointer;background:#322346;font-weight:700}.primary{background:linear-gradient(135deg,#7040c5,#b02d77)}.actions{display:flex;gap:8px;margin-top:15px}.actions button{width:auto}.record{border-top:1px solid #343042;padding:13px 0;display:flex;justify-content:space-between;gap:12px}.record button{width:auto}.status{white-space:pre-wrap;color:#f0d3ef}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}@media(max-width:600px){.grid{grid-template-columns:1fr}.actions{flex-wrap:wrap}}</style></head>
<body><main><a href="admin.html">← 情報管理へ戻る</a><h1>会場ガイド管理</h1><p class="note">会場公式サイトなどを確認し、設備とアクセス情報を登録します。利用者の体験談は公演ごとの会場掲示板に分けて掲載されます。</p><p id="gate">管理者権限を確認しています…</p>
<div id="workspace" hidden><section class="card"><h2 id="editorTitle">新規登録</h2><form id="editor"><div class="grid"><div><label for="venueName">会場名</label><input id="venueName" maxlength="200" required></div><div><label for="prefecture">都道府県</label><input id="prefecture" maxlength="100"></div><div><label for="city">市区町村</label><input id="city" maxlength="100"></div><div><label for="nearestStation">最寄駅</label><input id="nearestStation" maxlength="500"></div></div>
<label for="accessNotes">駅からのアクセス</label><textarea id="accessNotes" maxlength="1000"></textarea><label for="lockers">ロッカー</label><textarea id="lockers" maxlength="1000"></textarea><label for="toilets">トイレ</label><textarea id="toilets" maxlength="1000"></textarea><label for="convenienceStore">コンビニ・周辺施設</label><textarea id="convenienceStore" maxlength="1000"></textarea><label for="meetingSpot">待ち合わせ場所</label><textarea id="meetingSpot" maxlength="1000"></textarea>
<label for="officialUrl">会場公式URL</label><input id="officialUrl" type="url" maxlength="2048" required><label class="check"><input id="verified" type="checkbox">今回、公式情報と入力内容を確認した</label><p id="lastChecked" class="note"></p><label for="publicationStatus">公開状態</label><select id="publicationStatus"><option value="draft">下書き</option><option value="published">公開</option><option value="archived">非公開・保管</option></select><div class="actions"><button id="save" class="primary" type="submit">保存する</button><button id="reset" type="button">新規入力に戻る</button></div></form><p id="message" class="status" role="status" aria-live="polite"></p></section>
<section class="card"><h2>登録済み会場</h2><input id="search" type="search" placeholder="会場名・地域で検索"><div id="records"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="supabase.js"></script><script src="catalog.js"></script><script src="venue-admin.js"></script></body></html>
