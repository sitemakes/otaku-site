<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ユーザープロフィール | OTAKU LIVE</title><style>body{margin:0;background:#0b0b10;color:#f7f7fb;font-family:system-ui,sans-serif}.wrap{max-width:640px;margin:auto;padding:22px 16px}.card{background:#15151d;border:1px solid #343042;border-radius:18px;padding:18px;margin:14px 0}.score{font-size:28px;font-weight:800}.muted{color:#aeb0bd;font-size:13px;line-height:1.7}.review{border-top:1px solid #343042;padding:13px 0;white-space:pre-wrap}a{color:#d8c6ff}</style></head><body><main class="wrap"><a href="javascript:history.back()">← 戻る</a><section class="card"><h1 id="name">プロフィール</h1><div id="basic" class="muted"></div></section><section class="card"><h2>同行評価</h2><div id="summary" class="muted">読み込み中…</div><div id="reviews"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>const id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){const u=await otakuGetUser();if(!u){location.href=otakuLoginUrl(location.href);return}const [{data:p},{data:r,error}]=await Promise.all([otakuSupabase.from('otaku_profiles').select('display_name,username,prefecture,bio').eq('id',id).maybeSingle(),otakuSupabase.from('otaku_reviews').select('rating,punctuality,communication,courtesy,no_show,comment,created_at').eq('reviewee_id',id).eq('visibility','visible').order('created_at',{ascending:false})]);if(!p){summary.textContent='プロフィールを表示できません。';return}name.textContent=p.display_name||p.username||'ユーザー';basic.innerHTML=`@${esc(p.username||'')}<br>${esc(p.prefecture||'地域未設定')}<br>${esc(p.bio||'')}`;if(error||!r?.length){summary.textContent='まだ同行評価はありません。';reviews.textContent='';return}const avg=k=>(r.reduce((s,x)=>s+(x[k]||0),0)/r.length).toFixed(1);summary.innerHTML=`<span class="score">${avg('rating')}</span> / 5　${r.length}件<br>時間・約束 ${avg('punctuality')}　連絡 ${avg('communication')}　マナー ${avg('courtesy')}<br>無断キャンセル報告 ${r.filter(x=>x.no_show).length}件`;reviews.innerHTML=r.filter(x=>x.comment).map(x=>`<div class="review">★ ${x.rating}　${esc(x.comment)}<div class="muted">${new Date(x.created_at).toLocaleDateString('ja-JP')}</div></div>`).join('')}init();</script></body></html>
