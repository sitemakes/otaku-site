<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ユーザープロフィール | OTAKU LIVE</title>
<style>body{margin:0;background:#0b0b10;color:#f7f7fb;font-family:system-ui,sans-serif}.wrap{max-width:640px;margin:auto;padding:22px 16px}.card{background:#15151d;border:1px solid #343042;border-radius:18px;padding:18px;margin:14px 0}.score{font-size:28px;font-weight:800}.muted{color:#aeb0bd;font-size:13px;line-height:1.7}.review{border-top:1px solid #343042;padding:13px 0;white-space:pre-wrap}.activity-item{border-top:1px solid #343042;padding:13px 0}.activity-item:first-child{border-top:0;padding-top:0}.activity-title{font-weight:700}.activity-body{margin-top:5px;white-space:pre-wrap;line-height:1.6}.activity-meta{color:#aeb0bd;font-size:12px;margin-top:5px;line-height:1.5}a{color:#d8c6ff}.profile-head{display:flex;gap:14px;align-items:center}.avatar{width:80px;height:80px;border-radius:50%;object-fit:cover}.follow{border:0;border-radius:999px;padding:10px 15px;background:#7040c5;color:#fff;font-weight:700;cursor:pointer}.follow.off{background:#24202f;color:#d8c6ff;border:1px solid #544477}.follow:disabled{opacity:.6}.status{color:#d9d3f1;font-size:13px;min-height:1.4em}</style>
</head><body><main class="wrap"><a href="javascript:history.back()">← 戻る</a>
<section class="card"><div class="profile-head"><div id="avatarSlot"></div><div><h1 id="name">プロフィール</h1><div id="basic" class="muted"></div></div></div><div style="margin-top:14px"><button id="follow" class="follow" type="button" hidden></button><div id="followStatus" class="status" role="status" aria-live="polite"></div></div></section>
<section class="card"><h2>同行評価</h2><div id="summary" class="muted">読み込み中…</div><div id="reviews"></div></section>
<section class="card"><h2>活動実績</h2><div id="stats" class="muted">読み込み中…</div></section>
<section class="card"><h2>活動</h2><div id="activity" class="muted">読み込み中…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="content-safety.js"></script>
<script>
'use strict';
const id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let viewer=null, following=false, busy=false;
const categoryLabels={general:'総合',event_info:'公演情報',goods:'グッズ',venue:'会場',companion:'同行募集',other:'その他'};
async function toggleFollow(){if(!viewer||busy)return;busy=true;follow.disabled=true;const result=following?await otakuSupabase.from('otaku_user_follows').delete().eq('follower_id',viewer.id).eq('followed_id',id):await otakuSupabase.from('otaku_user_follows').insert({follower_id:viewer.id,followed_id:id});if(result.error){followStatus.textContent='フォロー状態を変更できませんでした。';}else{following=!following;renderFollow();followStatus.textContent=following?'フォローしました。':'フォローを解除しました。';}busy=false;follow.disabled=false}
function renderFollow(){follow.hidden=!viewer||viewer.id===id;follow.className=`follow${following?' off':''}`;follow.textContent=following?'フォロー中':'フォローする'}
function activityEmpty(text='公開されている活動はまだありません。'){activity.innerHTML=`<div class="muted">${text}</div>`}
async function loadStats(profile){
  const results=await Promise.all([
    otakuSupabase.from('otaku_board_posts').select('id',{count:'exact',head:true}).eq('user_id',id),
    otakuSupabase.from('otaku_event_records').select('id',{count:'exact',head:true}).eq('user_id',id).eq('visibility','public').eq('hidden',false),
    profile.show_attendance?otakuSupabase.from('otaku_event_attendees').select('event_id',{count:'exact',head:true}).eq('user_id',id):Promise.resolve({count:null,error:null})
  ]);
  const value=result=>result.error||result.count===null?'—':result.count;
  stats.innerHTML=`<div>掲示板投稿 <b>${value(results[0])}</b>件　公演後の記録 <b>${value(results[1])}</b>件${profile.show_attendance?`　参戦予定 <b>${value(results[2])}</b>件`:''}</div><div class="muted">公開中の情報をもとにした件数です。</div>`;
}
async function loadActivity(profile){
  loadStats(profile);
  const [postsResult, recordsResult] = await Promise.all([
    otakuSupabase.from('otaku_board_posts').select('id,title,body,category,created_at,event_id,idol_id').eq('user_id',id).order('created_at',{ascending:false}).limit(10),
    otakuSupabase.from('otaku_event_records').select('id,impression,setlist,attendance_note,updated_at,otaku_events(id,title,starts_at,venue)').eq('user_id',id).eq('visibility','public').eq('hidden',false).order('updated_at',{ascending:false}).limit(10)
  ]);
  const items=[];
  (postsResult.data||[]).forEach(post=>items.push({kind:'post',date:post.created_at,data:post}));
  (recordsResult.data||[]).forEach(record=>items.push({kind:'record',date:record.updated_at,data:record}));
  if(profile.show_attendance){
    const attendance=await otakuSupabase.from('otaku_event_attendees').select('event_id,created_at,otaku_events(id,title,starts_at,venue)').eq('user_id',id).order('created_at',{ascending:false}).limit(10);
    (attendance.data||[]).forEach(row=>items.push({kind:'attendance',date:row.created_at,data:row}));
  }
  items.sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!items.length){activityEmpty();return}
  activity.innerHTML=items.slice(0,20).map(item=>{
    const d=item.data;
    if(item.kind==='post'){
      const context=d.event_id?`<a href="board.html?event=${encodeURIComponent(d.event_id)}">公演掲示板</a>`:d.idol_id?`<a href="board.html?idol=${encodeURIComponent(d.idol_id)}">アイドル掲示板</a>`:'掲示板';
      return `<div class="activity-item"><div class="activity-title">${esc(d.title||categoryLabels[d.category]||'掲示板への投稿')}</div><div class="activity-body">${esc(d.body||'')}</div><div class="activity-meta">${context} · ${new Date(item.date).toLocaleDateString('ja-JP')}</div></div>`;
    }
    const event=d.otaku_events;
    if(item.kind==='record') return `<div class="activity-item"><div class="activity-title">公演後の記録：${esc(event?.title||'公演')}</div>${d.impression?`<div class="activity-body"><strong>感想</strong><br>${esc(d.impression)}</div>`:''}${d.setlist?`<div class="activity-body"><strong>セットリスト</strong><br>${esc(d.setlist)}</div>`:''}${d.attendance_note?`<div class="activity-body"><strong>参戦メモ</strong><br>${esc(d.attendance_note)}</div>`:''}<div class="activity-meta">${event?.id?`<a href="event.html?id=${event.id}">公演詳細</a> · `:''}${new Date(item.date).toLocaleDateString('ja-JP')}</div></div>`;
    return `<div class="activity-item"><div class="activity-title">参戦予定：${esc(event?.title||'公演')}</div><div class="activity-meta">${event?.starts_at?new Date(event.starts_at).toLocaleString('ja-JP'):''}${event?.venue?` · ${esc(event.venue)}`:''}</div></div>`;
  }).join('');
}
async function init(){viewer=await otakuGetUser();if(!viewer){location.href=otakuLoginUrl(location.href);return}if(!id||viewer.id===id){follow.hidden=true}else{const {data}=await otakuSupabase.from('otaku_user_follows').select('followed_id').eq('follower_id',viewer.id).eq('followed_id',id).maybeSingle();following=Boolean(data)}renderFollow();follow.onclick=toggleFollow;const [{data:p},{data:r,error}]=await Promise.all([otakuSupabase.from('otaku_public_profiles').select('display_name,username,avatar_url,age_range,gender,prefecture,bio,same_oshi_policy,show_favorites,show_attendance').eq('id',id).maybeSingle(),otakuSupabase.from('otaku_reviews').select('id,reviewer_id,rating,punctuality,communication,courtesy,no_show,comment,created_at').eq('reviewee_id',id).eq('visibility','visible').order('created_at',{ascending:false})]);if(!p){summary.textContent='プロフィールを表示できません。';activityEmpty('プロフィールを表示できません。');return}document.getElementById('name').textContent=p.display_name||p.username||'ユーザー';if(p.avatar_url){const img=document.createElement('img');img.src=p.avatar_url;img.alt='プロフィール画像';img.className='avatar';avatarSlot.append(img)}basic.innerHTML=`@${esc(p.username||'')}<br>${p.prefecture?esc(p.prefecture):'地域非公開'}<br>${p.bio?esc(p.bio):'自己紹介は非公開です'}`;loadActivity(p);if(error||!r?.length){summary.textContent='まだ同行評価はありません。';reviews.textContent='';return}const avg=k=>(r.reduce((s,x)=>s+(x[k]||0),0)/r.length).toFixed(1);summary.innerHTML=`<span class="score">${avg('rating')}</span> / 5　${r.length}件<br>時間・約束 ${avg('punctuality')}　連絡 ${avg('communication')}　マナー ${avg('courtesy')}<br>無断キャンセル報告 ${r.filter(x=>x.no_show).length}件`;reviews.innerHTML=r.map(x=>`<div class="review">★ ${x.rating}　${esc(x.comment||'コメントなし')} ${x.reviewer_id!==viewer.id?`<button onclick="otakuReportContent('review','${x.id}')">通報</button>`:''}<div class="muted">${new Date(x.created_at).toLocaleDateString('ja-JP')}</div></div>`).join('')}
init();
</script></body></html>
