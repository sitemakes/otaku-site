<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>退会 | OTAKU LIVE</title><link rel="stylesheet" href="safety-pages.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"><link rel="stylesheet" href="theme.css"></head><body><main class="wrap"><a href="profile.html">マイページへ</a><h1>OTAKU LIVEを退会する</h1><p>プロフィール、推し、参戦予定、投稿、通知、評価と関連するDM会話を削除します。相手の画面からもその会話が消えます。取り消せません。</p><p>共通のログイン情報と他サービスのデータは残ります。共通アカウント自体の削除は運営への個別依頼が必要です。</p><p>管理者は権限を引き継いでから退会してください。</p><label for="confirmation">「OTAKU LIVEを退会する」と入力</label><input id="confirmation" autocomplete="off"><button id="withdraw">退会してデータを削除する</button><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="supabase.js"></script><script>
document.getElementById('withdraw').onclick=async()=>{
 const button=document.getElementById('withdraw'),message=document.getElementById('message');
 const user=await otakuGetUser();if(!user){location.href=otakuLoginUrl(location.href);return}
 const confirmation=document.getElementById('confirmation').value;
 if(confirmation!=='OTAKU LIVEを退会する'){message.textContent='確認の文言を入力してください。';return}
 if(!confirm('OTAKU LIVEのデータを削除します。取り消せません。'))return;
 button.disabled=true;
 try{const {error}=await otakuSupabase.rpc('otaku_withdraw',{confirmation});if(error)throw error;
 await otakuSupabase.auth.signOut({scope:'local'});location.href='index.html';
 }catch(error){message.textContent=error.message==='admin_transfer_required'?'管理者権限の引き継ぎが必要です。':'退会できませんでした。';button.disabled=false}
};
</script></body></html>
