<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>プロフィール | OTAKU LIVE</title>
  <style>
    :root{--card:#15151d;--text:#f7f7fb;--muted:#9da0ad;--accent:#8b5cf6;--accent2:#ec4899;--line:#2a2a36;--ok:#34d399}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#0a0a0f,#11111a);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:#bbb;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:#0f0f15;color:white;font-size:15px}.field textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.secondary{background:#22222d;color:#eee;border:1px solid var(--line);margin-top:8px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.msg{margin-top:10px;color:#d9d3f1;font-size:14px}.events,.favorites{display:grid;gap:9px}.event,.favorite{padding:12px;border-radius:14px;background:#1e1e28;border:1px solid var(--line)}.event a{color:white;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.top a{color:#aaa;text-decoration:none}.favorite{display:flex;align-items:center;justify-content:space-between;gap:10px}.fav-main{font-size:14px}.fav-sub{font-size:12px;color:var(--muted);margin-top:3px}.fav-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.mini{border:1px solid var(--line);background:#292936;color:#eee;border-radius:999px;padding:7px 9px;font-size:12px;cursor:pointer}.mini.main{background:#173a2d;color:#a7f3d0;border-color:#245c46}.mini.danger{background:#351a20;color:#ffc1cd;border-color:#63303b}.oshi-add{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.oshi-add .btn{padding:13px 16px;white-space:nowrap}.section-note{margin-top:-3px;margin-bottom:10px}.heart{color:#ff83bd;margin-right:4px}@media(max-width:560px){.grid,.oshi-add{grid-template-columns:1fr}.favorite{align-items:flex-start;flex-direction:column}.fav-actions{justify-content:flex-start}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="top"><strong>OTAKU LIVE</strong><a href="index.html">ホーム</a></div>
  <section class="card"><h1 style="font-size:22px;margin-top:0">プロフィール</h1><div class="muted">同行募集・DMで表示される基本情報です。</div>
    <div class="field"><label>ユーザーID</label><input id="username" placeholder="例: kazuki_01" /></div>
    <div class="field"><label>表示名</label><input id="displayName" placeholder="例: かずき" /></div>
    <div class="grid">
      <div class="field"><label>年代</label><select id="ageRange"><option value="unspecified">未設定</option><option value="under_18">18歳未満</option><option value="18_19">18〜19歳</option><option value="20_24">20〜24歳</option><option value="25_29">25〜29歳</option><option value="30s">30代</option><option value="40_plus">40代以上</option></select></div>
      <div class="field"><label>性別</label><select id="gender"><option value="unspecified">未設定</option><option value="male">男性</option><option value="female">女性</option><option value="other">その他</option></select></div>
    </div>
    <div class="grid"><div class="field"><label>都道府県</label><input id="prefecture" placeholder="例: 福岡県" /></div><div class="field"><label>同担</label><select id="sameOshi"><option value="depends">どちらでも</option><option value="ok">OK</option><option value="ng">NG</option></select></div></div>
    <div class="field"><label>自己紹介</label><textarea id="bio" maxlength="500"></textarea></div>
    <div class="field"><strong>公開範囲</strong><label><input id="showAge" type="checkbox"> 年代を公開</label><label><input id="showGender" type="checkbox"> 性別を公開</label><label><input id="showPrefecture" type="checkbox"> 都道府県を公開</label><label><input id="showBio" type="checkbox"> 自己紹介を公開</label><label><input id="showFavorites" type="checkbox"> 推し情報を公開</label></div>
    <button id="save" class="btn primary">プロフィールを保存</button><div id="msg" class="msg"></div>
  </section>

  <section class="card"><h2 style="font-size:17px;margin-top:0">同行評価</h2><div id="trustSummary" class="muted">評価を読み込み中...</div></section>

  <section class="card"><h2 style="font-size:17px;margin-top:0">通知設定</h2><div class="muted section-note">通知は初期状態でOFFです。プロフィール作成時に選択でき、後から変更できます。</div><label class="check"><input id="notifyInApp" type="checkbox"> サイト内通知を受け取る</label><label class="check"><input id="notifyDm" type="checkbox"> DM通知を受け取る</label><label class="check"><input id="notifyBoard" type="checkbox"> 掲示板通知を受け取る</label><label class="check"><input id="notifyEvent" type="checkbox"> 参戦予定の公演リマインダーを受け取る</label><button id="saveNotifications" class="btn secondary">通知設定を保存</button><div id="notifyMsg" class="msg"></div></section>

  <section class="card">
    <h2 style="font-size:17px;margin-top:0">推し</h2>
    <div class="muted section-note">メイン推しは同行募集カードに最優先で表示されます。公開済みの実在メンバーを選択できます。</div>
    <label class="muted"><input id="showDemo" type="checkbox"> DEMOメンバーを選択する</label><div class="oshi-add">
      <div class="field" style="margin:0"><label>グループ</label><select id="groupSelect"></select></div>
      <div class="field" style="margin:0"><label>メンバー</label><select id="idolSelect"></select></div>
      <button id="addFavorite" class="btn primary">追加</button>
    </div>
    <div id="favMsg" class="msg"></div>
    <div id="favorites" class="favorites" style="margin-top:12px"><div class="muted">読み込み中...</div></div>
  </section>

  <section class="card"><h2 style="font-size:17px;margin-top:0">参戦予定</h2><div id="events" class="events"><div class="muted">読み込み中...</div></div></section>
  <p><a href="withdraw.html">退会・データ削除</a></p><p><a href="notifications.html">通知を見る</a></p><p><a href="safety.html">安全設定・自分の募集を管理</a></p>
  <p><a id="adminLink" href="admin.html" hidden>グループ・メンバー・公演を管理</a></p><p><a id="reportAdminLink" href="reports.html" hidden>通報を管理</a></p><button id="logout" class="btn secondary">ログアウト</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="profile-visibility.js"></script><script src="saved-favorites.js"></script>
<script>
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  let user=null, profile=null, idols=[], groups=[];
  async function requireUser(){user=await otakuGetUser(); if(!user){location.href=otakuLoginUrl(location.href);return false} return true}
  function fill(p){if(!p)return; username.value=p.username||'';displayName.value=p.display_name||'';ageRange.value=p.age_range||'unspecified';gender.value=p.gender||'unspecified';prefecture.value=p.prefecture||'';sameOshi.value=p.same_oshi_policy||'depends';bio.value=p.bio||'';showAge.checked=p.show_age!==false;showGender.checked=p.show_gender!==false;showPrefecture.checked=p.show_prefecture!==false;showBio.checked=p.show_bio!==false;showFavorites.checked=p.show_favorites!==false}
  async function loadEvents(){const {data,error}=await otakuSupabase.from('otaku_event_attendees').select('event_id,otaku_events(id,title,venue,starts_at)').eq('user_id',user.id).order('created_at',{ascending:false});const el=document.getElementById('events');if(error||!data?.length){el.innerHTML='<div class="muted">まだ参戦予定はありません。</div>';return}el.innerHTML=data.filter(x=>x.otaku_events).map(x=>`<div class="event"><a href="event.html?id=${x.otaku_events.id}">${esc(x.otaku_events.title)}</a><div class="muted">${new Date(x.otaku_events.starts_at).toLocaleString('ja-JP')} · ${esc(x.otaku_events.venue)}</div></div>`).join('')}

  async function loadTrustSummary(){const {data,error}=await otakuSupabase.from('otaku_reviews').select('rating,punctuality,communication,courtesy,no_show').eq('reviewee_id',user.id).eq('visibility','visible');const el=document.getElementById('trustSummary');if(error||!data?.length){el.textContent='まだ同行評価はありません。';return}const avg=k=>(data.reduce((sum,row)=>sum+(row[k]||0),0)/data.length).toFixed(1);el.innerHTML=`総合 <b>${avg('rating')} / 5</b>（${data.length}件）<br>時間・約束 ${avg('punctuality')}　連絡 ${avg('communication')}　マナー ${avg('courtesy')}<br>無断キャンセル報告 ${data.filter(row=>row.no_show).length}件`}

  async function loadIdols(){
    const {data,error}=await otakuSupabase.from('otaku_idols').select('id,name,group_id,otaku_idol_groups(id,name)').eq('publication_status','published').eq('is_demo',document.getElementById('showDemo').checked).order('name',{ascending:true});
    if(error){favMsg.textContent='アイドル情報を取得できませんでした。';return}
    idols=data||[];
    const map=new Map(); idols.forEach(i=>{if(i.otaku_idol_groups) map.set(i.otaku_idol_groups.id,i.otaku_idol_groups.name)});
    groups=[...map.entries()].map(([id,name])=>({id,name})).sort((a,b)=>a.name.localeCompare(b.name,'ja'));
    groupSelect.innerHTML='<option value="">グループを選択</option>'+groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');
    groupSelect.onchange=renderIdolOptions; renderIdolOptions();
  }
  function renderIdolOptions(){const groupId=groupSelect.value;const list=idols.filter(i=>i.group_id===groupId);idolSelect.innerHTML=list.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}

  async function loadFavorites(){
    const {data,error}=await otakuSupabase.from('otaku_user_favorites').select('idol_id,is_primary,created_at,otaku_idols(id,name,otaku_idol_groups(name))').eq('user_id',user.id).order('is_primary',{ascending:false}).order('created_at',{ascending:true});
    const el=document.getElementById('favorites');
    if(error){el.innerHTML='<div class="muted">推し情報を取得できませんでした。</div>';return}
    const rows=data||[];
    if(!rows.length){el.innerHTML='<div class="muted">まだ推しが登録されていません。</div>';return}
    el.innerHTML=rows.map(r=>`<div class="favorite"><div><div class="fav-main"><span class="heart">♥</span>${esc(r.otaku_idols?.name||'非公開のメンバー')}</div><div class="fav-sub">${esc(r.otaku_idols?.otaku_idol_groups?.name||'')}${r.is_primary?' · メイン推し':''}</div></div><div class="fav-actions"><a class="mini" href="board.html?idol=${encodeURIComponent(r.idol_id)}">掲示板</a>${r.is_primary?'<span class="mini main">メイン</span>':`<button class="mini" onclick="setPrimary('${r.idol_id}')">メインにする</button>`}<button class="mini danger" onclick="removeFavorite('${r.idol_id}',${r.is_primary?'true':'false'})">削除</button></div></div>`).join('');
  }
  async function loadNotificationPreferences(){const {data,error}=await otakuSupabase.from('otaku_notification_preferences').select('in_app_enabled,dm_enabled,board_enabled,event_reminder_enabled').eq('user_id',user.id).maybeSingle();if(error||!data)return;notifyInApp.checked=data.in_app_enabled;notifyDm.checked=data.dm_enabled;notifyBoard.checked=data.board_enabled;notifyEvent.checked=data.event_reminder_enabled}
  saveNotifications.onclick=async()=>{const payload={user_id:user.id,in_app_enabled:notifyInApp.checked,dm_enabled:notifyDm.checked,board_enabled:notifyBoard.checked,event_reminder_enabled:notifyEvent.checked,updated_at:new Date().toISOString()};const {error}=await otakuSupabase.from('otaku_notification_preferences').upsert(payload,{onConflict:'user_id'});notifyMsg.textContent=error?'通知設定を保存できませんでした。':'通知設定を保存しました。'};

  async function setPrimary(idolId){
    favMsg.textContent='';
    const {error:e1}=await otakuSupabase.from('otaku_user_favorites').update({is_primary:false}).eq('user_id',user.id);
    if(e1){favMsg.textContent='メイン推しを変更できませんでした。';return}
    const {error:e2}=await otakuSupabase.from('otaku_user_favorites').update({is_primary:true}).eq('user_id',user.id).eq('idol_id',idolId);
    favMsg.textContent=e2?'メイン推しを変更できませんでした。':'メイン推しを変更しました。';
    if(!e2) loadFavorites();
  }
  async function removeFavorite(idolId,wasPrimary){
    favMsg.textContent='';
    const {error}=await otakuSupabase.from('otaku_user_favorites').delete().eq('user_id',user.id).eq('idol_id',idolId);
    if(error){favMsg.textContent='削除できませんでした。';return}
    if(wasPrimary){
      const {data:left}=await otakuSupabase.from('otaku_user_favorites').select('idol_id').eq('user_id',user.id).limit(1);
      if(left?.length) await otakuSupabase.from('otaku_user_favorites').update({is_primary:true}).eq('user_id',user.id).eq('idol_id',left[0].idol_id);
    }
    favMsg.textContent='推しを削除しました。'; loadFavorites();
  }

  addFavorite.onclick=async()=>{
    favMsg.textContent='';
    profile=await otakuGetProfile(user.id);
    if(!profile){favMsg.textContent='先に上のプロフィールを保存してください。';return}
    const idolId=idolSelect.value;if(!idolId){favMsg.textContent='メンバーを選択してください。';return}
    const {data:existing}=await otakuSupabase.from('otaku_user_favorites').select('idol_id').eq('user_id',user.id);
    const isFirst=!(existing?.length);
    const {error}=await otakuSupabase.from('otaku_user_favorites').insert({user_id:user.id,idol_id:idolId,is_primary:isFirst});
    if(error){favMsg.textContent=error.code==='23505'?'すでに登録済みです。':'追加できませんでした。';return}
    favMsg.textContent='推しを追加しました。'; loadFavorites();
  };

  save.onclick=async()=>{const payload={id:user.id,username:username.value.trim(),display_name:displayName.value.trim(),age_range:ageRange.value,gender:gender.value,prefecture:prefecture.value.trim()||null,same_oshi_policy:sameOshi.value,bio:bio.value.trim()||null};if(!payload.username||!payload.display_name){msg.textContent='ユーザーIDと表示名は必須です。';return}const {error}=await otakuSupabase.from('otaku_profiles').upsert(payload,{onConflict:'id'});msg.textContent=error?'保存できませんでした。ユーザーIDが重複していないか確認してください。':'保存しました。';if(!error){profile=payload;const {error:notifyError}=await otakuSupabase.from('otaku_notification_preferences').upsert({user_id:user.id,in_app_enabled:notifyInApp.checked,dm_enabled:notifyDm.checked,board_enabled:notifyBoard.checked,event_reminder_enabled:notifyEvent.checked,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(notifyError){msg.textContent='プロフィールは保存しましたが通知設定を保存できませんでした。通知設定を再保存してください。';return}const next=otakuNextUrl('profile.html');if(next!=='profile.html') setTimeout(()=>location.href=next,400)}};
  logout.onclick=async()=>{await otakuSupabase.auth.signOut();location.href='index.html'};
  document.getElementById('showDemo').onchange=loadIdols;
  (async()=>{if(!await requireUser())return;const {data:admin}=await otakuSupabase.rpc('otaku_is_catalog_admin');document.getElementById('adminLink').hidden=!admin;document.getElementById('reportAdminLink').hidden=!admin;profile=await otakuGetProfile(user.id);fill(profile);await Promise.all([loadEvents(),loadIdols(),loadFavorites(),loadNotificationPreferences(),loadTrustSummary()])})();
</script>
</body>
</html>
