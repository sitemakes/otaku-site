<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掲示板 | OTAKU LIVE</title><style>body{margin:0;background:#0b0b10;color:#f7f7fb;font-family:system-ui,sans-serif}.wrap{max-width:700px;margin:auto;padding:20px 16px 60px}a{color:#d8c6ff}.card{background:#15151d;border:1px solid #343042;border-radius:16px;padding:16px;margin:14px 0}input,select,textarea,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #45404f;background:#101018;color:inherit;width:100%;box-sizing:border-box}button{background:#7040c5;font-weight:700;cursor:pointer;margin-top:8px}.post{border-top:1px solid #343042;padding:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}.post:first-child{border-top:0}.meta{color:#aeb0bd;font-size:13px}.danger,.small{background:#3a1830;width:auto;float:right;padding:6px 10px;font-size:12px}.status{color:#f0d3ef}.pin{color:#f5d27b;font-size:12px;margin-right:6px}.hint{color:#aeb0bd;font-size:13px;line-height:1.6}label{display:block;font-size:13px;margin:10px 0 5px}</style></head><body><main class="wrap"><a href="index.html">← ホーム</a> · <a href="boards.html">掲示板一覧</a><h1 id="title">掲示板</h1><p id="context" class="hint"></p><p id="login"></p><section class="card"><label for="category">カテゴリ</label><select id="category"></select><label for="postTitle">タイトル</label><input id="postTitle" maxlength="120" placeholder="例：物販は何時から並びますか？"><label for="body">本文</label><textarea id="body" maxlength="2000" rows="5" placeholder="この掲示板について書き込む"></textarea><button id="send">投稿する</button><p id="status" class="status"></p></section><section class="card"><div id="posts">読み込み中…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="content-safety.js"></script><script>
const p=new URLSearchParams(location.search),eventId=p.get('event'),idolId=p.get('idol');let user,isAdmin=false;const categoryParam=p.get('category')||'';const labels={general:'雑談・質問',fan:'ファン交流',goods:'グッズ',venue:'会場・アクセス',event_info:'公演情報',companion:'同行募集',seating:'座席・入場',other:'その他'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function categories(){const list=eventId?['event_info','venue','goods','companion','seating','other']:idolId?['general','fan','goods','event_info','other']:['general','fan','goods','venue','other'];category.replaceChildren(...list.map(x=>new Option(labels[x],x)));category.value=list.includes(categoryParam)?categoryParam:list[0]}
function queryUrl(cat){const q=new URLSearchParams();if(eventId)q.set('event',eventId);if(idolId)q.set('idol',idolId);q.set('category',cat);return 'board.html?'+q.toString()}
async function load(){const selected=category.value;let q=otakuSupabase.from('otaku_board_posts').select('id,user_id,title,body,category,pinned,created_at,otaku_profiles(display_name,username)').eq('category',selected).order('pinned',{ascending:false}).order('created_at',{ascending:false});if(eventId)q=q.eq('event_id',eventId);else if(idolId)q=q.eq('idol_id',idolId);else q=q.is('event_id',null).is('idol_id',null);const {data,error}=await q;if(error){posts.textContent='掲示板を読み込めませんでした。';return}posts.replaceChildren();if(!data?.length){posts.textContent='まだ投稿はありません。';return}for(const x of data){const article=document.createElement('article');article.className='post';const meta=document.createElement('div');meta.className='meta';const author=x.otaku_profiles?.display_name||x.otaku_profiles?.username||'ユーザー';meta.innerHTML=(x.pinned?'<span class="pin">📌 固定</span>':'')+esc(author)+' · '+new Date(x.created_at).toLocaleString('ja-JP');if(x.user_id===user?.id){const b=document.createElement('button');b.className='danger';b.textContent='削除';b.onclick=()=>removePost(x.id);meta.append(' ',b)}else{const b=document.createElement('button');b.className='small';b.textContent='通報';b.onclick=()=>otakuReportContent('board',x.id);meta.append(' ',b)}if(isAdmin){const pin=document.createElement('button');pin.className='small';pin.textContent=x.pinned?'固定解除':'固定';pin.onclick=async()=>{pin.disabled=true;const r=await otakuSupabase.rpc('otaku_set_board_pinned',{post_id:x.id,next_pinned:!x.pinned});if(r.error)alert('固定状態を変更できませんでした。');await load()};meta.append(' ',pin)}const heading=document.createElement('strong');heading.textContent=x.title;article.append(meta,heading,document.createTextNode('\n'+x.body));posts.append(article)}}
category.onchange=()=>{history.replaceState(null,'',queryUrl(category.value));context.textContent='カテゴリ：'+labels[category.value];load()};send.onclick=async()=>{const titleValue=postTitle.value.trim(),bodyValue=document.getElementById('body').value.trim();if(!titleValue||!bodyValue)return;send.disabled=true;const row={user_id:user.id,title:titleValue,body:bodyValue,category:category.value};if(eventId)row.event_id=eventId;else if(idolId)row.idol_id=idolId;const {error}=await otakuSupabase.from('otaku_board_posts').insert(row);status.textContent=error?'投稿できませんでした。':'投稿しました。';if(!error){postTitle.value='';document.getElementById('body').value='';await load()}send.disabled=false};async function removePost(id){if(!confirm('削除しますか？'))return;await otakuSupabase.from('otaku_board_posts').delete().eq('id',id);load()}
(async()=>{categories();user=await otakuGetUser();if(!user){login.innerHTML='投稿するには<a href="'+otakuLoginUrl(location.href)+'">ログイン</a>してください。';send.disabled=true}else{login.textContent='ログイン中';const r=await otakuSupabase.rpc('otaku_is_catalog_admin');isAdmin=!r.error&&r.data===true}document.getElementById('title').textContent=eventId?'公演掲示板':idolId?'アイドル掲示板':'全体掲示板';context.textContent='カテゴリ：'+labels[category.value];await load()})();</script></body></html>
