<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掲示板 | OTAKU LIVE</title><style>body{margin:0;background:#0b0b10;color:#f7f7fb;font-family:system-ui,sans-serif}.wrap{max-width:700px;margin:auto;padding:20px 16px 60px}a{color:#d8c6ff}.card{background:#15151d;border:1px solid #343042;border-radius:16px;padding:16px;margin:14px 0}textarea,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #45404f;background:#101018;color:inherit;width:100%;box-sizing:border-box}button{background:#7040c5;font-weight:700;cursor:pointer;margin-top:8px}.post{border-top:1px solid #343042;padding:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}.meta{color:#aeb0bd;font-size:13px}.danger{background:#3a1830;width:auto;float:right;padding:6px 10px;font-size:12px}.status{color:#f0d3ef}</style></head><body><main class="wrap"><a href="index.html">← ホーム</a><h1 id="title">掲示板</h1><p id="login"></p><section class="card"><textarea id="body" maxlength="2000" rows="4" placeholder="この公演・アイドルについて書き込む"></textarea><button id="send">投稿する</button><p id="status" class="status"></p></section><section class="card"><div id="posts">読み込み中…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
const p=new URLSearchParams(location.search),eventId=p.get('event'),idolId=p.get('idol');let user;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){user=await otakuGetUser();if(!user){login.innerHTML='投稿するには<a href="'+otakuLoginUrl(location.href)+'">ログイン</a>してください。';send.disabled=true}else login.textContent='ログイン中';const q=otakuSupabase.from('otaku_board_posts').select('id,user_id,body,created_at,otaku_profiles(display_name,username)').order('created_at',{ascending:true});const {data,error}=await q.eq(eventId?'event_id':'idol_id',eventId||idolId);if(error){posts.textContent='掲示板を読み込めませんでした。';return}posts.innerHTML=data.length?data.map(x=>'<article class="post"><div class="meta">'+esc(x.otaku_profiles?.display_name||x.otaku_profiles?.username||'ユーザー')+' · '+new Date(x.created_at).toLocaleString('ja-JP')+(x.user_id===user?.id?' <button class="danger" onclick="removePost(\''+x.id+'\')">削除</button>':'')+'</div>'+esc(x.body)+'</article>').join(''):'まだ投稿はありません。';}
send.onclick=async()=>{const body=document.getElementById('body').value.trim();if(!body)return;send.disabled=true;const row={user_id:user.id,body};if(eventId)row.event_id=eventId;else row.idol_id=idolId;const {error}=await otakuSupabase.from('otaku_board_posts').insert(row);status.textContent=error?'投稿できませんでした。':'投稿しました。';if(!error){document.getElementById('body').value='';await load()}send.disabled=false};async function removePost(id){if(!confirm('削除しますか？'))return;await otakuSupabase.from('otaku_board_posts').delete().eq('id',id);load()}load();</script></body></html>
