<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>掲示板 | OTAKU LIVE</title>
  <style>
    body{margin:0;background:#0a0a0f;color:#f4f2f8;font-family:system-ui,sans-serif}.wrap{max-width:700px;margin:auto;padding:20px 16px 60px}a{color:#ffc9e1}.card{background:#15151d;border:1px solid #2c2a33;border-radius:16px;padding:16px;margin:14px 0}input,select,textarea,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #3a3740;background:#101018;color:inherit;width:100%;box-sizing:border-box}button{background:#d6246f;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}button:disabled{opacity:.55;cursor:wait}.post{border-top:1px solid #2c2a33;padding:18px 0;white-space:pre-wrap;overflow-wrap:anywhere}.post:first-child{border-top:0}.meta{color:#aeb0bd;font-size:13px}.post-title{display:block;font-size:17px;margin:8px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.actions button{width:auto;padding:7px 11px;font-size:12px;margin:0}.danger{background:#3a1830}.status{color:#f0d3ef}.pin{color:#f5d27b;font-size:12px;margin-right:6px}.resolved{display:inline-block;color:#a7f3d0;background:#18372c;border-radius:999px;padding:2px 8px;font-size:12px;margin-left:7px}.hint{color:#aeb0bd;font-size:13px;line-height:1.6}label{display:block;font-size:13px;margin:10px 0 5px}.board-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.board-tools input,.board-tools select{width:100%}.check{display:flex;align-items:center;gap:7px;grid-column:1/-1;margin:0}.check input{width:auto}.replies{margin:14px 0 0 18px;padding-left:12px;border-left:2px solid #2c2a33;white-space:normal}.reply{padding:11px 0;border-top:1px solid #26232a;white-space:pre-wrap}.reply:first-child{border-top:0}.reply-form{margin-top:10px}.reply-form textarea{min-height:84px}.reply-count{color:#ffbdd9;font-size:13px}
  </style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"><link rel="stylesheet" href="theme.css">
</head>
<body><main class="wrap">
  <a href="index.html">← ホーム</a> · <a href="boards.html">掲示板一覧</a>
  <h1 id="title">掲示板</h1><p id="context" class="hint"></p><p id="login"></p>
  <section class="card" id="composer">
    <label for="category">カテゴリ</label><select id="category"></select>
    <label for="postTitle">タイトル</label><input id="postTitle" maxlength="120" placeholder="例：物販は何時から並びますか？">
    <label for="body">本文</label><textarea id="body" maxlength="2000" rows="5" placeholder="この掲示板について書き込む"></textarea>
    <button id="send" type="button">投稿する</button><p id="status" class="status" role="status" aria-live="polite"></p>
  </section>
  <section class="card"><div class="board-tools">
    <input id="postSearch" type="search" placeholder="タイトル・本文・投稿者で検索" aria-label="投稿を検索">
    <select id="postSort" aria-label="並び順"><option value="new">新しい順</option><option value="old">古い順</option><option value="pinned">固定を先に</option></select>
    <select id="resolutionFilter" aria-label="解決状態"><option value="">すべて</option><option value="open">未解決</option><option value="resolved">解決済み</option></select>
    <label class="check"><input id="savedOnly" type="checkbox"> 保存した投稿だけ</label>
  </div><div id="posts">読み込み中…</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="supabase.js"></script><script src="content-safety.js"></script><script src="board.js?v=final1510766"></script><script src="legal-links.js"></script>
</body></html>
