name: marketing
on:
  schedule:
    - cron: '7 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - dry-run
          - check
          - report
          - post
        default: dry-run
        required: true
permissions:
  contents: read
concurrency:
  group: marketing
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node scripts/marketing/post.mjs
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' && '1' || '0' }}
          CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check' && '1' || '0' }}
          REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'report' && '1' || '0' }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
