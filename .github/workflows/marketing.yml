name: marketing
on:
  schedule:
    - cron: '7 10 * * *'
    - cron: '37 11 * * *'
    - cron: '7 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - dry-run
          - check
          - report
          - post
          - auto
          - announce
        default: dry-run
        required: true
      announce_name:
        type: string
        default: intro
        required: true
permissions:
  contents: read
  issues: write
concurrency:
  group: marketing
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: node scripts/marketing/post.mjs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' && '1' || '0' }}
          CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check' && '1' || '0' }}
          REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'report' && '1' || '0' }}
          AUTO_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'auto' && '1' || '0' }}
          ANNOUNCE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'announce' && inputs.announce_name || '' }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
