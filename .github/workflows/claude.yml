# Issue / PR で @claude とメンションすると、Claude が対応してPRを作る
# 本番反映（main へのマージ）は必ず人間が行う
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: anthropics/claude-code-action@v1
        with:
          # Pro/Max プランの OAuth トークン（claude setup-token で発行、有効期限1年）
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(bash scripts/check.sh),Bash(node --test:*),Bash(node --check:*)"
            --append-system-prompt "CLAUDE.md のルールに従うこと。DB（Supabase）には接続できないので、DB変更が必要な場合は db/ に新しい SQL ファイルとして記録し、適用手順と戻し手順を PR 本文に書くこと。完了前に bash scripts/check.sh が OK になることを確認すること。"
