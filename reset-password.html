<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パスワード再設定 | OTAKU LIVE</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b0b10;color:#f7f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:auto;padding:32px 16px}.card{background:#15151d;border:1px solid #2a2a36;border-radius:24px;padding:22px}.brand{font-weight:900;letter-spacing:.06em;margin-bottom:20px}.field{margin:14px 0}.field label{display:block;color:#bbb;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:14px;border-radius:14px;border:1px solid #2a2a36;background:#0f0f15;color:#fff;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-size:16px;font-weight:800;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:12px;background:#211d2f;color:#d8d2ee;line-height:1.6}.back{display:inline-block;margin-top:16px;color:#aaa}</style></head><body><main class="wrap"><div class="brand">OTAKU LIVE</div><section class="card"><h1>新しいパスワードを設定</h1><p>8文字以上の新しいパスワードを入力してください。</p><div class="field"><label for="password">新しいパスワード</label><input id="password" type="password" autocomplete="new-password" minlength="8"></div><div class="field"><label for="confirm">確認</label><input id="confirm" type="password" autocomplete="new-password" minlength="8"></div><button id="save" class="btn">パスワードを更新</button><div id="msg" class="msg" hidden></div></section><a class="back" href="login.html">← ログインへ戻る</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="supabase.js"></script><script>const password=document.getElementById('password'),confirmPassword=document.getElementById('confirm'),save=document.getElementById('save'),msg=document.getElementById('msg');function show(text){msg.hidden=false;msg.textContent=text}(async()=>{const {data:{session}}=await otakuSupabase.auth.getSession();if(!session)show('再設定リンクが無効か、期限切れです。ログイン画面からもう一度メールを送信してください。')})();save.onclick=async()=>{if(password.value.length<8){show('パスワードは8文字以上にしてください。');return}if(password.value!==confirmPassword.value){show('確認用パスワードが一致しません。');return}save.disabled=true;const {error}=await otakuSupabase.auth.updateUser({password:password.value});if(error){show('パスワードを更新できませんでした。再設定メールをもう一度送信してください。');save.disabled=false;return}show('パスワードを更新しました。ログイン画面へ移動します。');setTimeout(()=>location.href='login.html',1200)};</script></body></html>
