<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>グッズ交換 | OTAKU LIVE</title><style>
:root{--bg:#0a0a0f;--card:#15151d;--muted:#a7a8b4;--line:#2c2a33;--accent:#d6246f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f2f8;font-family:system-ui,sans-serif}.wrap{max-width:780px;margin:auto;padding:20px 16px 70px}a{color:#ffc9e1}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;color:#c5c5cf;margin:11px 0 5px}input,select,textarea,button{width:100%;padding:11px;border-radius:10px;border:1px solid #3e3b44;background:#101018;color:inherit;font:inherit}textarea{resize:vertical}button{cursor:pointer;background:#3d1b2d;font-weight:700}.primary{background:linear-gradient(135deg,#d6246f,#d6246f)}.note,.meta{color:var(--muted);font-size:13px;line-height:1.6}.warning{background:#2c2116;border:1px solid #6d4d27;border-radius:12px;padding:12px;color:#f3d3a0;font-size:13px;line-height:1.6}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.post{padding:16px 0;border-top:1px solid var(--line)}.post:first-child{border-top:0}.post h3{margin:7px 0;font-size:17px}.tags,.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{background:#211e25;border-radius:999px;padding:5px 9px;font-size:12px}.actions button{width:auto;padding:8px 11px;font-size:13px}.danger{background:#3a1830}.saved{background:#18372c}.status{color:#ffc9e1;white-space:pre-wrap}.check{display:flex;gap:7px;align-items:center;margin:8px 0}.check input{width:auto}@media(max-width:620px){.grid,.filters{grid-template-columns:1fr}}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"><link rel="stylesheet" href="theme.css"></head><body><main class="wrap"><a href="index.html">← ホーム</a><h1>グッズ交換</h1><p class="note">譲りたい・求めているグッズを登録し、DMで相談できます。</p><div class="warning">代金の支払いや住所は公開欄に書かず、必要な情報はDMで慎重に確認してください。OTAKU LIVEは取引の仲介や代金の預かりを行いません。</div><p id="gate" class="status"></p>
<section id="composer" class="card" hidden><h2>募集を作成</h2><div class="grid"><div><label for="tradeType">募集の種類</label><select id="tradeType"><option value="trade">交換したい</option><option value="offer">譲りたい</option><option value="want">求めている</option></select></div><div><label for="deliveryMethod">受け渡し方法</label><select id="deliveryMethod"><option value="meetup">現地交換</option><option value="mail">郵送</option><option value="either">どちらでも</option></select></div><div><label for="groupSelect">グループ</label><select id="groupSelect"></select></div><div><label for="idolSelect">メンバー（任意）</label><select id="idolSelect"></select></div><div><label for="eventSelect">交換希望の公演（任意）</label><select id="eventSelect"></select></div><div id="prefectureField"><label for="meetupPrefecture">交換希望の都道府県</label><input id="meetupPrefecture" maxlength="20" placeholder="例：東京都"></div></div><label for="itemName">グッズ名</label><input id="itemName" maxlength="120" placeholder="例：公式生写真 〇〇衣装"><label for="description">条件・説明</label><textarea id="description" maxlength="1500" rows="5" placeholder="数量、状態、交換条件など。住所や電話番号は書かないでください。"></textarea><button id="createPost" class="primary" type="button">募集を公開</button><p id="formStatus" class="status" role="status"></p></section>
<section class="card"><h2>募集を探す</h2><div class="filters"><input id="search" type="search" placeholder="グッズ名・説明で検索"><select id="typeFilter" aria-label="譲る・求めるで絞り込み"><option value="">すべての種類</option><option value="trade">交換</option><option value="offer">譲る</option><option value="want">求める</option></select><select id="groupFilter" aria-label="グループで絞り込み"><option value="">全グループ</option></select></div><label class="check"><input id="savedOnly" type="checkbox">保存した募集だけ表示</label><div id="posts" class="note">読み込み中…</div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="supabase.js"></script><script src="safety.js"></script><script src="content-safety.js"></script><script src="goods.js"></script><script src="legal-links.js"></script><script src="bottom-nav.js"></script>
</body></html>
