<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>評価管理 | OTAKU LIVE</title><style>body{margin:0;background:#0a0a0f;color:#f4f2f8;font-family:system-ui,sans-serif}.wrap{max-width:860px;margin:auto;padding:22px 16px}.card{background:#15151d;border:1px solid #2c2a33;border-radius:18px;padding:16px;margin:12px 0}.muted{color:#aeb0bd;font-size:13px;line-height:1.6}button,input,select{font:inherit;padding:9px;border-radius:9px;border:1px solid #3a3740;background:#101018;color:inherit}button{background:#d6246f}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}a{color:#ffc9e1}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"><link rel="stylesheet" href="theme.css"></head><body><main class="wrap"><a href="admin.html">← 管理画面</a><h1>同行評価の管理</h1><p id="gate">管理者権限を確認しています…</p><div id="workspace" hidden><label>状態 <select id="filter"><option value="">すべて</option><option value="visible">公開中</option><option value="hidden">非表示</option></select></label><p id="message"></p><div id="list"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="supabase.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rows=[];async function load(){let q=otakuSupabase.from('otaku_reviews').select('id,reviewer_id,reviewee_id,rating,punctuality,communication,courtesy,no_show,comment,visibility,moderation_reason,created_at').order('created_at',{ascending:false}).limit(200);if(filter.value)q=q.eq('visibility',filter.value);const {data,error}=await q;if(error){message.textContent='評価を取得できませんでした。';return}rows=data||[];const ids=[...new Set(rows.flatMap(x=>[x.reviewer_id,x.reviewee_id]))];const {data:profiles}=ids.length?await otakuSupabase.from('otaku_profiles').select('id,display_name,username').in('id',ids):{data:[]};const map=Object.fromEntries((profiles||[]).map(x=>[x.id,x]));list.innerHTML=rows.length?rows.map(r=>`<article class="card"><b>${esc(map[r.reviewer_id]?.display_name||'ユーザー')} → ${esc(map[r.reviewee_id]?.display_name||'ユーザー')}</b><div class="muted">総合 ${r.rating} / 時間 ${r.punctuality} / 連絡 ${r.communication} / マナー ${r.courtesy}${r.no_show?' / 無断キャンセル報告':''}<br>${esc(r.comment||'コメントなし')}<br>状態: ${r.visibility==='visible'?'公開中':'非表示'} ${esc(r.moderation_reason||'')}</div><div class="row">${r.visibility==='visible'?`<input id="reason-${r.id}" maxlength="500" placeholder="非表示理由（必須）"><button onclick="moderate('${r.id}','hidden')">非表示</button>`:`<button onclick="moderate('${r.id}','visible')">再公開</button>`}</div></article>`).join(''):'評価はありません。'}async function moderate(id,state){const reason=state==='hidden'?document.getElementById('reason-'+id).value.trim():null;if(state==='hidden'&&!reason){message.textContent='非表示理由を入力してください。';return}const {error}=await otakuSupabase.from('otaku_reviews').update({visibility:state,moderation_reason:reason}).eq('id',id);message.textContent=error?'更新できませんでした。':'更新しました。';if(!error)load()}filter.onchange=load;(async()=>{const u=await otakuGetUser();if(!u){gate.textContent='管理者アカウントでログインしてください。';return}const {data}=await otakuSupabase.rpc('otaku_is_catalog_admin');if(!data){gate.textContent='管理者権限がありません。';return}gate.hidden=true;workspace.hidden=false;load()})();</script></body></html>
