<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同行評価 | OTAKU LIVE</title><style>body{margin:0;background:#0a0a0f;color:#f4f2f8;font-family:system-ui,sans-serif}.wrap{max-width:620px;margin:auto;padding:22px 16px}.card{background:#15151d;border:1px solid #2c2a33;border-radius:18px;padding:18px;margin:14px 0}.field{margin:13px 0}label{display:block;color:#c8cad3;margin-bottom:6px}select,textarea,button{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #3a3740;background:#101018;color:inherit;font:inherit}textarea{min-height:100px}button{background:linear-gradient(135deg,#d6246f,#d6246f);font-weight:700}.muted{color:#aeb0bd;font-size:13px;line-height:1.6}a{color:#ffc9e1}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"><link rel="stylesheet" href="theme.css"></head><body><main class="wrap"><a href="dm.html">← DM一覧</a><h1>同行後の評価</h1><p class="muted">公演終了後に、同じ同行DMの相手を1回だけ評価できます。評価は今後の同行相手選びの参考として表示されます。</p><section class="card"><h2 id="target">確認中…</h2><form id="form"><div class="field"><label>総合評価</label><select id="rating"></select></div><div class="field"><label>時間・約束を守った</label><select id="punctuality"></select></div><div class="field"><label>連絡が丁寧だった</label><select id="communication"></select></div><div class="field"><label>礼儀・マナーがよかった</label><select id="courtesy"></select></div><div class="field"><label><input id="noShow" type="checkbox" style="width:auto"> 無断キャンセルだった</label></div><div class="field"><label>コメント（任意・500文字まで）</label><textarea id="comment" maxlength="500"></textarea></div><button type="submit">評価を送信</button></form><p id="message" class="muted"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="supabase.js"></script><script>const id=new URLSearchParams(location.search).get('conversation');let user,c,other;for(const key of ['rating','punctuality','communication','courtesy'])document.getElementById(key).innerHTML=[5,4,3,2,1].map(n=>`<option value="${n}">${n}</option>`).join('');async function init(){user=await otakuGetUser();if(!user){location.href=otakuLoginUrl(location.href);return}const {data,error}=await otakuSupabase.from('otaku_conversations').select('id,event_id,owner_user_id,requester_user_id,otaku_events(title,starts_at)').eq('id',id).maybeSingle();if(error||!data){message.textContent='評価対象を確認できませんでした。';form.hidden=true;return}c=data;other=c.owner_user_id===user.id?c.requester_user_id:c.owner_user_id;const [{data:p},{data:done}]=await Promise.all([otakuSupabase.from('otaku_profiles').select('display_name,username').eq('id',other).maybeSingle(),otakuSupabase.from('otaku_reviews').select('id').eq('conversation_id',id).eq('reviewer_id',user.id).maybeSingle()]);target.textContent=(p?.display_name||p?.username||'ユーザー')+' · '+(c.otaku_events?.title||'公演');if(done){form.hidden=true;message.textContent='この同行は評価済みです。'}else if(new Date(c.otaku_events?.starts_at)>new Date()){form.hidden=true;message.textContent='公演終了後に評価できます。'}}form.onsubmit=async e=>{e.preventDefault();const row={conversation_id:id,reviewer_id:user.id,reviewee_id:other,rating:+rating.value,punctuality:+punctuality.value,communication:+communication.value,courtesy:+courtesy.value,no_show:noShow.checked,comment:comment.value.trim()||null};const {error}=await otakuSupabase.from('otaku_reviews').insert(row);message.textContent=error?(error.code==='23505'?'この同行は評価済みです。':'評価を送信できませんでした。'):'評価を送信しました。';if(!error)form.hidden=true};init();</script></body></html>
