<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知 | OTAKU LIVE</title><style>body{margin:0;background:#0a0a0f;color:#f4f2f8;font-family:system-ui,sans-serif}.wrap{max-width:640px;margin:auto;padding:22px 16px}.card{background:#15151d;border:1px solid #2c2a33;border-radius:16px;padding:14px;margin:10px 0}.unread{border-color:#d6246f}.meta{color:#aeb0bd;font-size:13px}a{color:#ffc9e1}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.tabs button,button{border:1px solid #3a3740;border-radius:999px;background:#22222d;color:#eee;padding:9px 12px}.tabs button.active{background:#d6246f}.count{color:#ffb4da;font-size:12px}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"><link rel="stylesheet" href="theme.css"><main class="wrap"><a href="profile.html">← マイページ</a><h1>通知 <span id="count" class="count"></span></h1><div class="tabs"><button data-kind="all" class="active">すべて</button><button data-kind="dm">DM</button><button data-kind="board">掲示板</button><button data-kind="event">公演</button><button data-kind="event_new">新規公演</button><button data-kind="event_change">変更・中止</button><button data-kind="unread">未読</button><button data-kind="archived">整理済み</button></div><button id="readAll">すべて既読にする</button><div id="list">読み込み中…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="supabase.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function safeHref(value){return /^(?:(?:chat|event)\.html\?id=[0-9a-f-]{36}|board\.html\?(?:(?:event|idol)=[0-9a-f-]{36}|(?:(?:event|idol)=[0-9a-f-]{36}&category=[a-z_]{1,32}|category=[a-z_]{1,32})(?:#post-[0-9a-f-]{36})?))$/i.test(value||'')?value:'#'}let user,rows=[],kind='all';function matchesKind(n){if(kind==='archived')return !!n.archived_at;if(n.archived_at)return false;if(kind==='unread')return !n.read_at;if(kind==='event_new')return n.kind==='event'&&n.title.includes('お気に入りグループの新しい公演');if(kind==='event_change')return n.kind==='event'&&!n.title.includes('お気に入りグループの新しい公演');return kind==='all'||n.kind===kind}async function load(){user=await otakuGetUser();if(!user){location.href=otakuLoginUrl(location.href);return}const {data,error}=await otakuSupabase.from('otaku_notifications').select('id,kind,title,body,href,read_at,archived_at,created_at').order('created_at',{ascending:false}).limit(100);if(error){list.textContent='通知を取得できませんでした。';return}rows=data||[];render()}function render(){const unread=rows.filter(n=>!n.read_at);count.textContent=unread.length?'未読 '+unread.length:'';const filtered=rows.filter(matchesKind);list.innerHTML=filtered.length?filtered.map(n=>`<article class="card ${n.read_at?'':'unread'}"><a href="${esc(safeHref(n.href))}" data-id="${n.id}"><b>${esc(n.title)}</b></a><p>${esc(n.body)}</p><button data-archive="${n.id}">${n.archived_at?'整理を戻す':'整理済みにする'}</button><div class="meta">${new Date(n.created_at).toLocaleString('ja-JP')}</div></article>`).join(''):'通知はありません。';document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=async()=>{const archived=b.textContent.includes('整理済み');const {error}=await otakuSupabase.from('otaku_notifications').update({archived_at:archived?null:new Date().toISOString()}).eq('id',b.dataset.archive);if(!error)load()});document.querySelectorAll('[data-id]').forEach(a=>a.onclick=async(event)=>{event.preventDefault();const {error}=await otakuSupabase.from('otaku_notifications').update({read_at:new Date().toISOString()}).eq('id',a.dataset.id);if(!error)location.href=a.href;else alert('既読状態を保存できませんでした。');})}document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));render()});readAll.onclick=async()=>{await otakuSupabase.from('otaku_notifications').update({read_at:new Date().toISOString()}).eq('user_id',user.id).is('read_at',null);load()};load();</script></html>
