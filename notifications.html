<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知 | OTAKU LIVE</title><style>body{margin:0;background:#0b0b10;color:#f7f7fb;font-family:system-ui,sans-serif}.wrap{max-width:640px;margin:auto;padding:22px 16px}.card{background:#15151d;border:1px solid #343042;border-radius:16px;padding:14px;margin:10px 0}.unread{border-color:#8b5cf6}.meta{color:#aeb0bd;font-size:13px}a{color:#d8c6ff}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button,button{border:1px solid #45404f;border-radius:999px;background:#22222d;color:#eee;padding:9px 12px}.tabs button.active{background:#7040c5}.count{color:#ffb4da;font-size:12px}</style><main class="wrap"><a href="profile.html">← マイページ</a><h1>通知 <span id="count" class="count"></span></h1><div class="tabs"><button data-kind="all" class="active">すべて</button><button data-kind="dm">DM</button><button data-kind="board">掲示板</button><button data-kind="event">公演</button></div><button id="readAll">すべて既読にする</button><div id="list">読み込み中…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function safeHref(value){return /^(chat\.html\?id=|board\.html\?(event|idol)=|event\.html\?id=)[0-9a-f-]{36}$/i.test(value||'')?value:'#'}let user,rows=[],kind='all';async function load(){user=await otakuGetUser();if(!user){location.href=otakuLoginUrl(location.href);return}const {data,error}=await otakuSupabase.from('otaku_notifications').select('id,kind,title,body,href,read_at,created_at').order('created_at',{ascending:false}).limit(100);if(error){list.textContent='通知を取得できませんでした。';return}rows=data||[];render()}function render(){const unread=rows.filter(n=>!n.read_at);count.textContent=unread.length?'未読 '+unread.length:'';const filtered=kind==='all'?rows:rows.filter(n=>n.kind===kind);list.innerHTML=filtered.length?filtered.map(n=>`<article class="card ${n.read_at?'':'unread'}"><a href="${esc(safeHref(n.href))}" data-id="${n.id}"><b>${esc(n.title)}</b></a><p>${esc(n.body)}</p><div class="meta">${new Date(n.created_at).toLocaleString('ja-JP')}</div></article>`).join(''):'通知はありません。';document.querySelectorAll('[data-id]').forEach(a=>a.onclick=async(event)=>{event.preventDefault();const {error}=await otakuSupabase.from('otaku_notifications').update({read_at:new Date().toISOString()}).eq('id',a.dataset.id);if(!error)location.href=a.href;else alert('既読状態を保存できませんでした。');})}document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));render()});readAll.onclick=async()=>{await otakuSupabase.from('otaku_notifications').update({read_at:new Date().toISOString()}).eq('user_id',user.id).is('read_at',null);load()};load();</script></html>
