<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知 | OTAKU LIVE</title><style>body{margin:0;background:#0b0b10;color:#f7f7fb;font-family:system-ui,sans-serif}.wrap{max-width:640px;margin:auto;padding:22px 16px}.card{background:#15151d;border:1px solid #343042;border-radius:16px;padding:14px;margin:10px 0}.unread{border-color:#8b5cf6}.meta{color:#aeb0bd;font-size:13px}a{color:#d8c6ff}</style><main class="wrap"><a href="profile.html">← マイページ</a><h1>通知</h1><div id="list">読み込み中…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const u=await otakuGetUser();if(!u){location.href=otakuLoginUrl(location.href);return}const {data,error}=await otakuSupabase.from('otaku_notifications').select('id,kind,title,body,href,read_at,created_at').order('created_at',{ascending:false}).limit(100);if(error){list.textContent='通知を取得できませんでした。';return}list.innerHTML=data?.length?data.map(n=>`<article class="card ${n.read_at?'':'unread'}"><a href="${n.href||'#'}" data-id="${n.id}"><b>${esc(n.title)}</b></a><p>${esc(n.body)}</p><div class="meta">${new Date(n.created_at).toLocaleString('ja-JP')}</div></article>`).join(''):'通知はありません。';document.querySelectorAll('[data-id]').forEach(a=>a.onclick=async()=>{await otakuSupabase.from('otaku_notifications').update({read_at:new Date().toISOString()}).eq('id',a.dataset.id);})}load();</script></html>
