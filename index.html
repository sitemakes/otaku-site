<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OTAKU LIVE</title>
  <meta name="description" content="アイドル現場の参戦予定・同行募集をまとめるMVP" />
  <style>
    :root{--bg:#0b0b10;--card:#15151d;--card2:#1c1c26;--text:#f7f7fb;--muted:#9da0ad;--accent:#8b5cf6;--accent2:#ec4899;--line:#2a2a36}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#0a0a0f,#11111a);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    .wrap{max-width:760px;margin:0 auto;padding:18px 16px 96px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-weight:900;letter-spacing:.06em}.right{display:flex;gap:8px;align-items:center}.pill,.login{border:1px solid var(--line);background:var(--card);padding:9px 12px;border-radius:999px;color:var(--muted);font-size:13px;text-decoration:none}.login{color:white}
    .hero{padding:22px;border-radius:24px;background:radial-gradient(circle at top right,rgba(236,72,153,.28),transparent 40%),linear-gradient(135deg,#20143a,#171722);border:1px solid #343042;margin-bottom:18px}.hero h1{font-size:28px;line-height:1.2;margin:0 0 8px}.hero p{margin:0;color:#c9c9d4;line-height:1.6}
    .search{margin:16px 0 20px}.search input{width:100%;padding:15px 16px;border-radius:16px;border:1px solid var(--line);background:#111118;color:white;font-size:16px;outline:none}.search input:focus{border-color:var(--accent)}
    h2{font-size:18px;margin:20px 2px 12px}.events{display:grid;gap:12px}.event{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;transition:.18s}.event:hover{transform:translateY(-1px);border-color:#4b3f74;background:var(--card2)}.row{display:flex;gap:12px;align-items:flex-start}.datebox{width:60px;flex:0 0 60px;border-radius:16px;background:#211a33;padding:10px 6px;text-align:center;border:1px solid #3a2f59}.datebox .m{font-size:11px;color:#c8b8ef}.datebox .d{font-size:24px;font-weight:800}.event h3{font-size:16px;margin:1px 0 6px}.meta{font-size:13px;color:var(--muted);line-height:1.6}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badge{font-size:12px;padding:6px 9px;border-radius:999px;background:#20202a;color:#d7d7df}.badge.hot{background:#3a1830;color:#ffb4da}
    .empty,.error{padding:24px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:18px}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(11,11,16,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}.bottom .inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 12px 12px}.nav{text-align:center;color:#8e90a0;font-size:12px;text-decoration:none}.nav b{display:block;color:white;font-size:18px;margin-bottom:3px}.demo{font-size:11px;color:#8d8fa0;margin-top:8px}.loading{opacity:.7}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><div class="brand">OTAKU LIVE</div><div class="right"><div class="pill">MVP</div><a id="authLink" class="login" href="login.html">ログイン</a></div></div>
    <section class="hero"><h1>次の現場を、<br>一緒に楽しむ人を探そう。</h1><p>ライブを起点に、参戦予定・同行募集・現地交流をつなぐアイドルファン向けプラットフォーム。</p></section>
    <div class="search"><input id="q" placeholder="ライブ名・会場・地域で検索" /><div style="display:flex;gap:8px;margin-top:8px"><select id="groupFilter" style="flex:1;padding:10px;border-radius:12px;background:#111118;color:white;border:1px solid var(--line)"><option value="">全グループ</option></select><select id="monthFilter" style="flex:1;padding:10px;border-radius:12px;background:#111118;color:white;border:1px solid var(--line)"><option value="">全開催月</option></select></div></div>
    <h2>開催予定ライブ</h2><label class="meta"><input id="showDemo" type="checkbox"> DEMO公演を表示する</label>
    <div id="events" class="events"><div class="empty loading">公演データを読み込み中...</div></div>
    <div class="demo">実在公演は出典を確認して登録しています。最新情報は公演詳細の出典でご確認ください。</div>
  </main>
  <nav class="bottom"><div class="inner"><a class="nav" href="index.html"><b>⌂</b>ホーム</a><a class="nav" href="#q"><b>⌕</b>探す</a><a class="nav" href="dm.html"><b>💬</b>DM</a><a class="nav" href="profile.html"><b>👤</b>マイページ</a></div></nav>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
  <script>
    let all=[]; const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    function fmt(iso){const d=new Date(iso);return {m:d.toLocaleString('ja-JP',{month:'numeric',timeZone:'Asia/Tokyo'}),day:d.toLocaleString('ja-JP',{day:'numeric',timeZone:'Asia/Tokyo'}).replace('日',''),time:d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'})}}
    function render(items){const el=document.getElementById('events');const q=document.getElementById('q').value.trim().toLowerCase(),g=document.getElementById('groupFilter').value,m=document.getElementById('monthFilter').value;items=items.filter(x=>(!q||[x.title,x.venue,x.prefecture,x.city,x.otaku_idol_groups?.name].join(' ').toLowerCase().includes(q))&&(!g||x.group_id===g)&&(!m||x.starts_at.slice(0,7)===m));if(!items.length){el.innerHTML='<div class="empty">該当する公演がありません。</div>';return}el.innerHTML=items.map(e=>{const f=fmt(e.starts_at);return `<a class="event" href="event.html?id=${encodeURIComponent(e.id)}"><div class="row"><div class="datebox"><div class="m">${f.m}</div><div class="d">${f.day}</div></div><div><h3>${e.is_demo?"[DEMO] ":""}${esc(e.title)}</h3><div class="meta">${esc(e.otaku_idol_groups?.name||'')} · ${esc(e.venue)} · ${esc(e.prefecture||'')} ${esc(e.city||'')}<br>${f.time} 開演</div><div class="badges"><span class="badge">参戦予定</span><span class="badge hot">同行募集</span></div></div></div></a>`}).join('')}
    async function load(){const {data,error}=await otakuSupabase.from('otaku_events').select('id,group_id,title,venue,prefecture,city,starts_at,is_demo,otaku_idol_groups(id,name)').eq('publication_status','published').eq('is_demo',document.getElementById('showDemo').checked).gte('starts_at',new Date().toISOString()).order('starts_at',{ascending:true});if(error){document.getElementById('events').innerHTML='<div class="error">公演データの取得に失敗しました。</div>';return}all=data||[];const gs=[...new Map(all.filter(x=>x.otaku_idol_groups).map(x=>[x.group_id,x.otaku_idol_groups])).values()];groupFilter.innerHTML='<option value="">全グループ</option>'+gs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const ms=[...new Set(all.map(x=>x.starts_at.slice(0,7)))];monthFilter.innerHTML='<option value="">全開催月</option>'+ms.map(x=>`<option value="${x}">${x.replace('-','年')}月</option>`).join('');render(all)}
    document.getElementById('q').addEventListener('input',()=>render(all));document.getElementById('groupFilter').onchange=()=>render(all);document.getElementById('monthFilter').onchange=()=>render(all)
    (async()=>{const u=await otakuGetUser();if(u){const p=await otakuGetProfile(u.id);const a=document.getElementById('authLink');a.href='profile.html';a.textContent=p?.display_name||'マイページ'}})();
    document.getElementById('showDemo').onchange=()=>{document.getElementById('q').value='';load()};
    load();
  </script>
</body>
</html>
